/* POCKET FEVER — DOM UI, "ARCADE FEVER" (docs/ART_DIRECTION.md). An 80s–90s cabinet with Balatro-grade juice:
   chunky pixel type with hard ink outlines, dark purple panels, saturated slab buttons that press down, chasing
   bulbs, gentle idle sway. Color = meaning: PTS blue · MULT red · ×MULT magenta · TOKEN/JACKPOT gold · SHOTS green.
   Sizes are rem; ui.ts sets html font-size to 16px × k (k ∈ 1, 1.5, 2) so the pixel faces stay on their grids:
   PF Pixel (m6x11plus) 18/27/36/54/72 px · PF Pixel KR (Neo둥근모) 16/32 · PF Pixel KR Bold (Galmuri11) 12/24/36 ·
   PF Arcade (Jersey 10) 56/74.67/112/149.33. */

html { font-size: 16px; }
html, body { margin: 0; height: 100%; background: #0B0614; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
.pf-ui input { touch-action: manipulation; -webkit-user-select: text; user-select: text; }
#app { position: fixed; inset: 0; overflow: hidden; background: #0B0614; }
#app > canvas, .pf-canvas { position: absolute; left: 0; top: 0; display: block; touch-action: none; }
.pf-ui-root { position: absolute; inset: 0; }

.pf-ui {
  --ink: #0B0614;
  --bg1: #120A24; --bg2: #1C1036; --bg3: #2A1650; --bg4: #3A2170; --bg5: #503096;
  --txt: #FFF7EA; --txt2: #D2C6F0; --txt3: #9585C4;
  --pink: #FF2E88; --orange: #FF8A1F; --yellow: #FFD43B; --cyan: #36F1E0;
  --blue: #22B8FF; --red: #FF3B4E; --mag: #E83CFF; --gold: #FFC531; --green: #3DDC84; --wish: #A98BFF;
  --blue-d: #0C6CA8; --red-d: #A3172C; --mag-d: #8A1A9E; --gold-d: #A86F00; --green-d: #168449; --orange-d: #B0500A;
  --pink-d: #9E1150; --cyan-d: #12877E; --violet-d: #24104A;
  --f-px: "PF Pixel", "PF Pixel KR", "PF Pixel KR Bold", ui-monospace, monospace;
  --f-kr: "PF Pixel KR", "PF Pixel", "PF Pixel KR Bold", "PF UI", sans-serif;
  --f-krb: "PF Pixel KR Bold", "PF Pixel KR", "PF Pixel", "PF UI", sans-serif;
  --f-ar: "PF Arcade", "PF Pixel", "PF Pixel KR Bold", sans-serif;
  --o: .125rem;
  --out: calc(-1 * var(--o)) 0 0 var(--ink), var(--o) 0 0 var(--ink), 0 calc(-1 * var(--o)) 0 var(--ink), 0 var(--o) 0 var(--ink),
    calc(-1 * var(--o)) calc(-1 * var(--o)) 0 var(--ink), var(--o) calc(-1 * var(--o)) 0 var(--ink),
    calc(-1 * var(--o)) var(--o) 0 var(--ink), var(--o) var(--o) 0 var(--ink);
  --out-drop: var(--out), 0 calc(var(--o) * 2.5) 0 var(--ink), var(--o) calc(var(--o) * 2.5) 0 var(--ink), calc(-1 * var(--o)) calc(var(--o) * 2.5) 0 var(--ink);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --scan: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, rgba(0,0,0,0) 1px 3px);
  position: absolute; inset: 0; z-index: 1; overflow: hidden; pointer-events: none;
  font: 1rem/1.25 var(--f-kr); color: var(--txt);
  -webkit-font-smoothing: none; -moz-osx-font-smoothing: grayscale; font-smooth: never; text-rendering: optimizeSpeed;
  font-variant-ligatures: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
.pf-ui *, .pf-ui *::before, .pf-ui *::after { box-sizing: border-box; }
.pf-ui [hidden] { display: none !important; }
.pf-host { display: contents; }
.pf-ui button, .pf-ui input, .pf-ui a, .pf-ui [tabindex], .pf-ui .pf-layer { pointer-events: auto; }
.pf-ui .pf-layer.pf-leaving, .pf-ui .pf-layer.pf-leaving * { pointer-events: none; }
:where(.pf-ui) :where(button) { font: inherit; color: inherit; margin: 0; }
.pf-ui :focus { outline: none; }
.pf-ui :focus-visible { outline: .1875rem solid var(--cyan); outline-offset: .25rem; }

/* ------------------------------------------------------------------------------------------- type helpers */
.pf-lbl { font: 1.125rem/1 var(--f-px); color: var(--txt3); text-shadow: 0 .125rem 0 var(--ink); white-space: nowrap; }
.pf-cap { display: inline-flex; align-items: baseline; gap: .5rem; white-space: nowrap; font: 1.125rem/1 var(--f-px); color: var(--txt2); text-transform: uppercase; text-shadow: 0 .125rem 0 var(--ink); }
.pf-cap-ko { font: 1rem/1 var(--f-kr); color: var(--txt3); text-transform: none; }
.k-blue { color: var(--blue); } .k-red { color: var(--red); } .k-mag { color: var(--mag); } .k-gold { color: var(--gold); }
.k-green { color: var(--green); } .k-wish { color: var(--wish); } .k-orange { color: var(--orange); }

/* ------------------------------------------------------------------------------------------- glyphs & marks */
.pf-g { display: inline-grid; place-items: center; width: 1.5rem; height: 1.5rem; line-height: 0; flex: none; }
.pf-g svg { width: 100%; height: 100%; display: block; overflow: visible; }
.pf-g.flip svg { transform: scaleX(-1); }

.pf-token {
  position: relative; display: inline-block; flex: none; width: 1.25rem; height: 1.25rem; border-radius: 50%;
  background: radial-gradient(circle at 36% 30%, #FFF2B0 0 14%, var(--gold) 15% 58%, #E89F0C 59% 100%);
  box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .1875rem #E8A30E, inset 0 0 0 .25rem rgba(255,242,176,.6);
}
.pf-token::after { content: ""; position: absolute; left: 50%; top: 50%; width: 22%; height: 46%; transform: translate(-50%, -50%); background: #B87400; border-radius: .0625rem; box-shadow: 0 -.0625rem 0 rgba(255,250,220,.5); }
.pf-tokamt { display: inline-flex; align-items: center; gap: .375rem; font: 1.125rem/1 var(--f-px); color: var(--gold); text-shadow: var(--out); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pf-tokamt b { font-weight: normal; }

.pf-rarity { display: inline-block; padding: .1875rem .375rem .25rem; border-radius: .25rem; font: 1.125rem/1 var(--f-px); color: #fff; text-shadow: 0 .125rem 0 rgba(11,6,20,.6); box-shadow: 0 0 0 .125rem var(--ink); background: #6D5BA8; }
.pf-rarity[data-r="2"] { background: var(--cyan-d); }
.pf-rarity[data-r="3"] { background: var(--pink); }
.pf-rarity.trick { color: var(--ink); background: var(--cyan); text-shadow: none; }

/* pool balls as glossy sprites with a dark outline */
.pf-ball {
  --c: #C6352C;
  position: relative; display: inline-block; flex: none; width: 2rem; height: 2rem; border-radius: 50%;
  background:
    radial-gradient(circle at 32% 26%, rgba(255,255,255,.85) 0 9%, rgba(255,255,255,.2) 20%, rgba(255,255,255,0) 36%),
    radial-gradient(circle at 64% 76%, rgba(0,0,0,0) 46%, rgba(0,0,0,.36) 100%),
    var(--c);
  box-shadow: 0 0 0 .125rem var(--ink), 0 .25rem 0 0 rgba(11,6,20,.55);
}
.pf-ball.stripe {
  background:
    radial-gradient(circle at 32% 26%, rgba(255,255,255,.85) 0 9%, rgba(255,255,255,.2) 20%, rgba(255,255,255,0) 36%),
    radial-gradient(circle at 64% 76%, rgba(0,0,0,0) 46%, rgba(0,0,0,.32) 100%),
    linear-gradient(180deg, #F6F0E2 0 26%, var(--c) 26% 74%, #F6F0E2 74%);
}
.pf-ball.cue { --c: #F6F0E2; }
.pf-ball b {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 1.125rem; height: 1.125rem; border-radius: 50%; display: grid; place-items: center; padding-top: .0625rem;
  font: 1.125rem/1 var(--f-px); font-weight: normal; color: #120A24; background: #FBF6EA; letter-spacing: -.0625rem;
}
.pf-ball.sm { width: 1.375rem; height: 1.375rem; }
.pf-ball.sm b { transform: translate(-50%, -50%) scale(.75); }
.pf-ball.lg { width: 3.5rem; height: 3.5rem; }
.pf-ball.lg b { width: 1.75rem; height: 1.75rem; font-size: 2.25rem; }
.pf-ball-wish {
  position: absolute; right: -.375rem; bottom: -.25rem; width: 1.125rem; height: 1.125rem; border-radius: .25rem; display: grid; place-items: center;
  color: #fff; background: var(--wish); box-shadow: 0 0 0 .125rem var(--ink);
}
.pf-ball-wish svg { width: 86%; height: 86%; }

.pf-eight {
  position: relative; display: inline-block; flex: none; width: 1.5rem; height: 1.5rem; border-radius: 50%;
  background: radial-gradient(circle at 32% 26%, #8A8A9A 0 8%, #2C2A36 26%, #0D0C12 70%);
  box-shadow: 0 0 0 .125rem var(--ink);
}
.pf-eight b { position: absolute; left: 50%; top: 50%; width: 1.125rem; height: 1.125rem; transform: translate(-50%, -50%) scale(.72); border-radius: 50%; display: grid; place-items: center; padding-top: .0625rem; background: #F6F0E2; color: #0D0C12; font: 1.125rem/1 var(--f-px); font-weight: normal; }
.pf-eight.sm { width: 1.25rem; height: 1.25rem; }
.pf-eight.gone { opacity: .35; filter: grayscale(1); }
.pf-eight.logo { width: 1.75rem; height: 1.75rem; }

/* ------------------------------------------------------------------------------------------- slab buttons */
.pf-btn {
  --c: var(--bg4); --cd: var(--violet-d);
  appearance: none; -webkit-appearance: none; border: 0; cursor: pointer; position: relative;
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  min-height: 2.75rem; padding: .375rem 1rem .4375rem; border-radius: .375rem; white-space: nowrap;
  color: #fff; background: var(--c);
  box-shadow: 0 0 0 .125rem var(--ink), inset 0 .1875rem 0 rgba(255,255,255,.22), inset 0 -.1875rem 0 rgba(0,0,0,.18), 0 .25rem 0 0 var(--cd), 0 .25rem 0 .125rem var(--ink);
  text-shadow: 0 .125rem 0 rgba(11,6,20,.7);
  transition: translate .07s, box-shadow .07s, filter .12s;
}
.pf-btn-tx { display: inline-flex; align-items: baseline; gap: .5rem; }
.pf-btn .ko { font: 1rem/1 var(--f-kr); }
.pf-btn .en { font: 1.125rem/1 var(--f-px); opacity: .8; }
.pf-btn.stack .pf-btn-tx { flex-direction: column; align-items: center; gap: .3125rem; }
.pf-btn-ic { width: 1.375rem; height: 1.375rem; filter: drop-shadow(0 .125rem 0 rgba(11,6,20,.7)); }
.pf-btn:hover { filter: brightness(1.1); animation: pf-wobble .45s ease-in-out; }
.pf-btn:active { translate: 0 .25rem; box-shadow: 0 0 0 .125rem var(--ink), inset 0 .1875rem 0 rgba(255,255,255,.22), inset 0 -.1875rem 0 rgba(0,0,0,.18), 0 0 0 0 var(--cd), 0 0 0 .125rem var(--ink); }
.pf-btn:disabled { filter: grayscale(.8) brightness(.7); cursor: default; animation: none; }
.pf-btn.primary, .pf-btn.orange { --c: var(--orange); --cd: var(--orange-d); }
.pf-btn.red { --c: var(--red); --cd: var(--red-d); }
.pf-btn.green { --c: var(--green); --cd: var(--green-d); }
.pf-btn.blue { --c: var(--blue); --cd: var(--blue-d); }
.pf-btn.big { min-height: 3.5rem; padding: .5rem 1.375rem .625rem; }
.pf-btn.big .ko { font: 1.5rem/1 var(--f-krb); }
.pf-btn.wide { min-width: 12rem; }
.pf-btn.small { min-height: 2.125rem; padding: .25rem .75rem .3125rem; }
.pf-ui kbd { font: 1.125rem/1 var(--f-px); padding: .125rem .3125rem .1875rem; border-radius: .25rem; background: rgba(11,6,20,.35); box-shadow: inset 0 0 0 .125rem rgba(11,6,20,.45); text-shadow: none; }
.pf-iconbtn {
  width: 2.5rem; height: 2.5rem; border: 0; border-radius: .375rem; cursor: pointer; display: grid; place-items: center; color: #fff;
  background: var(--bg4); box-shadow: 0 0 0 .125rem var(--ink), inset 0 .1875rem 0 rgba(255,255,255,.18), 0 .25rem 0 0 var(--violet-d), 0 .25rem 0 .125rem var(--ink);
  transition: translate .07s;
}
.pf-iconbtn:hover { filter: brightness(1.15); }
.pf-iconbtn:active { translate: 0 .25rem; box-shadow: 0 0 0 .125rem var(--ink); }

/* chasing marquee bulbs: a border of moving dots */
.pf-bulbs::before {
  content: ""; position: absolute; inset: -.4375rem; border-radius: .5rem; pointer-events: none;
  --bc: var(--gold);
  background:
    radial-gradient(circle, var(--bc) 0 .1875rem, rgba(0,0,0,0) .2rem) 0 0 / .75rem .4375rem repeat-x,
    radial-gradient(circle, var(--bc) 0 .1875rem, rgba(0,0,0,0) .2rem) 0 100% / .75rem .4375rem repeat-x,
    radial-gradient(circle, var(--bc) 0 .1875rem, rgba(0,0,0,0) .2rem) 0 0 / .4375rem .75rem repeat-y,
    radial-gradient(circle, var(--bc) 0 .1875rem, rgba(0,0,0,0) .2rem) 100% 0 / .4375rem .75rem repeat-y;
  filter: drop-shadow(0 0 .25rem var(--bc));
  animation: pf-chase var(--chase, 1.4s) linear infinite;
}
@keyframes pf-chase {
  from { background-position: 0 0, 0 100%, 0 0, 100% 0; }
  to { background-position: .75rem 0, -.75rem 100%, 0 -.75rem, 100% .75rem; }
}

/* ------------------------------------------------------------------------------------------- HUD */
/* One landscape layout for phone and PC: the table takes the full height. Two side columns hold the controls
   (left: JACKPOT · POWER bar · TOKENS — right: BUILD/PAUSE · SPIN face · TRICKS); four plates are
   inlaid in the rail wood between the pockets (top: SCORE → TARGET · relics — bottom: status · TABLE + SHOTS).
   Nothing sits on the felt, the cushions or a pocket. --plh = plate height (hud.ts). */
.pf-hud { position: absolute; inset: 0; pointer-events: none; }
.pf-col { position: absolute; display: flex; flex-direction: column; align-items: stretch; gap: .5rem; }
.pf-pod {
  position: relative; display: flex; align-items: center; gap: .5rem;
  border-radius: .375rem; background: var(--scan), rgba(18,10,36,.9);
  box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .125rem rgba(80,48,150,.85), 0 .1875rem 0 0 var(--ink);
}
.pf-tab {
  position: relative; z-index: 1; flex: none; padding: .125rem .3125rem .1875rem; border-radius: .25rem;
  font: 1.125rem/1 var(--f-px); color: #fff; background: var(--bg5); box-shadow: 0 0 0 .125rem var(--ink); text-shadow: 0 .125rem 0 rgba(11,6,20,.6); white-space: nowrap;
}
.pf-tab.gold { color: var(--ink); background: var(--gold); text-shadow: none; }
.pf-ctl-lbl { flex: none; font: 1.125rem/1 var(--f-px); color: var(--txt2); text-shadow: 0 .125rem 0 var(--ink); white-space: nowrap; }
.pf-ctl-ko { flex: none; font: .875rem/1 var(--f-kr); color: var(--txt3); white-space: nowrap; }

/* rail plates: dark glass inlaid in the wood, a neon edge, contents on one line */
.pf-plate {
  position: absolute; display: flex; align-items: center; gap: .4375rem; padding: 0 .375rem; min-width: 0;
  border-radius: .375rem; background: var(--scan), rgba(11,6,20,.84);
  box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .125rem rgba(80,48,150,.8), 0 0 .5rem rgba(11,6,20,.5);
  transition: opacity .18s;
}
.pf-plate > .pf-pod { flex: 1 1 auto; min-width: 0; height: 100%; padding: 0; background: none; box-shadow: none; border-radius: 0; }
.pf-plate .pf-chip { height: calc(var(--plh) - .5rem); }
.pf-plate.tr { justify-content: center; }
.pf-plate.bl { justify-content: flex-start; }
.pf-plate.br { justify-content: flex-end; }
/* the tally plaque owns the bottom rail while it runs: the bottom plates step back */
.pf-hud:has(~ .pf-plaque:not([hidden])) .pf-plate.bl, .pf-hud:has(~ .pf-plaque:not([hidden])) .pf-plate.br { opacity: 0; }

/* SCORE → TARGET (top-left plate) */
.pf-scorepod { gap: .375rem; }
.pf-scorebox { position: relative; flex: 1 1 auto; min-width: 0; height: 100%; display: flex; align-items: center; justify-content: flex-end; padding: 0 .25rem; }
.pf-score { display: inline-block; font: 1.6875rem/1 var(--f-px); color: #fff; text-shadow: var(--out); font-variant-numeric: tabular-nums; transform-origin: 100% 60%; white-space: nowrap; }
.pf-prog { position: absolute; left: 0; right: 0; bottom: .1875rem; height: .1875rem; border-radius: .125rem; background: rgba(255,255,255,.08); overflow: hidden; }
.pf-prog-fill { position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(0); background: linear-gradient(90deg, var(--green-d), var(--green)); transition: transform .5s var(--spring); }
.pf-scorepod.met .pf-prog-fill { background: linear-gradient(90deg, var(--gold-d), var(--gold)); }
.pf-scorepod.met .pf-score { color: var(--gold); }
.pf-scorepod[data-over="2"] .pf-prog-fill { background: linear-gradient(90deg, var(--orange), var(--yellow)); }
.pf-scorepod[data-over="3"] .pf-prog-fill { background: linear-gradient(90deg, var(--red), var(--mag), var(--yellow), var(--red)); background-size: 200% 100%; animation: pf-slide 1s linear infinite; }
.pf-targetcol { flex: none; display: flex; align-items: baseline; gap: .3125rem; }
.pf-target-n { font: 1.6875rem/1 var(--f-px); color: var(--red); text-shadow: var(--out); font-variant-numeric: tabular-nums; }
.pf-met { color: var(--gold); text-shadow: 0 .125rem 0 var(--ink); animation: pf-blink 1s steps(2, start) infinite; }
.pf-scorepod[data-flare="1"] .pf-score { color: var(--yellow); }
.pf-scorepod[data-flare="2"] .pf-score { color: var(--orange); }
.pf-scorepod[data-flare="3"] .pf-score { color: var(--red); text-shadow: var(--out), 0 0 .75rem rgba(255,59,78,.8); }
.pf-scorepod[data-flare="4"] .pf-score, .pf-plaque.molten .pf-pl-total b {
  color: transparent; text-shadow: none;
  background: linear-gradient(180deg, #FFF6B8 0%, var(--yellow) 30%, var(--orange) 55%, var(--pink) 80%, var(--mag) 100%);
  -webkit-background-clip: text; background-clip: text;
  filter: drop-shadow(.125rem 0 0 var(--ink)) drop-shadow(-.125rem 0 0 var(--ink)) drop-shadow(0 .125rem 0 var(--ink)) drop-shadow(0 -.125rem 0 var(--ink)) drop-shadow(0 0 .5rem rgba(255,46,136,.8));
}
/* +delta rises from the score toward the room above the table (never down onto the felt) */
.pf-ghost { position: absolute; right: 5rem; bottom: 55%; z-index: 3; pointer-events: none; white-space: nowrap; font: 1.6875rem/1 var(--f-px); color: #fff; text-shadow: var(--out); }
.pf-ghost[data-t="1"] { color: var(--yellow); }
.pf-ghost[data-t="2"] { color: var(--orange); }
.pf-ghost[data-t="3"] { color: var(--red); }
.pf-ghost[data-t="4"] { color: var(--mag); }

/* JACKPOT (left column, top): tab over the 8-ball and the amount */
.pf-jackpot { --chase: 2.2s; flex: none; flex-wrap: wrap; justify-content: center; gap: .3125rem .25rem; padding: .375rem .25rem .4375rem; }
.pf-jackpot::before { opacity: .5; inset: -.3125rem; }
.pf-jackpot > .pf-tab { flex-basis: 100%; text-align: center; }
.pf-banknum { display: inline-block; font: 1.6875rem/1 var(--f-px); color: var(--gold); text-shadow: var(--out); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pf-banknum[data-len="5"] { font-size: 1.40625rem; }
.pf-banknum[data-len="6"], .pf-banknum[data-len="7"], .pf-banknum[data-len="8"], .pf-banknum[data-len="9"] { font-size: 1.125rem; }
.pf-jackpot .pf-eight.logo { width: 1.375rem; height: 1.375rem; }
.pf-jackpot[data-lv="0"] .pf-banknum { color: #C9A44E; }
.pf-jackpot[data-lv="1"] { --chase: 1.3s; }
.pf-jackpot[data-lv="1"]::before { opacity: .8; }
.pf-jackpot[data-lv="2"] { --chase: .7s; box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .125rem var(--gold-d), 0 .1875rem 0 0 var(--ink), 0 0 1rem rgba(255,197,49,.45); }
.pf-jackpot[data-lv="2"]::before { opacity: 1; }
.pf-jackpot[data-lv="3"] { --chase: .32s; box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .125rem var(--orange), 0 .1875rem 0 0 var(--ink), 0 0 1.4rem rgba(255,90,60,.7); animation: pf-jpthrob .5s ease-in-out infinite; }
.pf-jackpot[data-lv="3"]::before { --bc: var(--orange); opacity: 1; }
.pf-jackpot[data-lv="3"] .pf-banknum { color: #FFE27A; text-shadow: var(--out), 0 0 .75rem rgba(255,138,31,.9); }
.pf-jackpot.gone::before { opacity: 0; }
.pf-jackpot.gone .pf-banknum { color: var(--txt3); }
.pf-jackpot.pulse .pf-banknum { animation: pf-pop .45s var(--spring); }

/* TABLE n/8 · kind · STAKE · SHOTS (bottom-right plate) */
.pf-tablepod { justify-content: flex-end; gap: .375rem; }
.pf-tablepod .pf-tab b { font-weight: normal; }
.pf-kind { flex: none; padding: .1875rem .3125rem .25rem; border-radius: .25rem; font: 1.125rem/1 var(--f-px); color: #fff; text-shadow: 0 .125rem 0 rgba(11,6,20,.6); box-shadow: 0 0 0 .125rem var(--ink); }
.pf-kind[data-kind="risky"] { background: var(--orange); }
.pf-kind[data-kind="endless"] { background: var(--cyan-d); }
.pf-tab.pf-staketab { cursor: help; color: var(--ink); background: var(--sc, var(--pink)); text-shadow: none; }
.pf-shots { display: flex; align-items: center; gap: .3125rem; min-width: 0; }
.pf-shots .pf-lbl { color: var(--green); }
.pf-pips { display: flex; align-items: center; gap: .1875rem; }
.pf-pip { width: .625rem; height: calc(var(--plh) - .875rem); max-height: 1.375rem; border-radius: .125rem; background: rgba(61,220,132,.1); box-shadow: inset 0 0 0 .125rem rgba(61,220,132,.32); transition: background .2s; }
.pf-pip.on { background: linear-gradient(180deg, #A4F7C8 0 22%, var(--green) 22%); box-shadow: 0 0 0 .125rem var(--ink), 0 0 .5rem rgba(61,220,132,.5); }
.pf-shotnum { font: 1.6875rem/1 var(--f-px); color: var(--green); text-shadow: var(--out); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pf-shotnum b { font-weight: normal; }
.pf-shotnum span { color: var(--txt3); font-size: 1.125rem; }

/* relics (top-right plate): tiles sized to the plate */
.pf-relics { display: flex; gap: .4375rem; }
.pf-relic {
  --rc: #6D5BA8;
  position: relative; width: calc(var(--plh) - .375rem); height: calc(var(--plh) - .375rem); max-width: 2.375rem; max-height: 2.375rem;
  padding: 0; border: 0; border-radius: .3125rem; cursor: help; flex: none;
  display: grid; place-items: center; color: #fff;
  background: var(--scan), radial-gradient(circle at 50% 35%, #3E2580, #22113F);
  box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .1875rem var(--rc), inset 0 .375rem 0 .1875rem rgba(255,255,255,.08);
  animation: pf-sway 5s ease-in-out infinite; animation-delay: var(--sd, 0s);
  transition: filter .15s;
}
.pf-relic[data-r="2"] { --rc: var(--cyan-d); }
.pf-relic[data-r="3"] { --rc: var(--pink); }
.pf-relic-g { width: 70%; height: 70%; filter: drop-shadow(0 .125rem 0 var(--ink)); }
.pf-relic:hover, .pf-relic:focus-visible { filter: brightness(1.3); }
.pf-relic-cnt {
  position: absolute; right: -.4375rem; top: -.4375rem; min-width: 1.25rem; height: 1.25rem; padding: .125rem .1875rem 0; border-radius: .25rem;
  font: 1.125rem/1 var(--f-px); text-align: center; color: var(--ink); background: var(--yellow); box-shadow: 0 0 0 .125rem var(--ink);
}
.pf-relic-ring { position: absolute; inset: -.25rem; border-radius: .5rem; pointer-events: none; box-shadow: 0 0 0 .1875rem var(--yellow), 0 0 1rem var(--yellow); }
.pf-relic.lit { animation: pf-relit .6s ease-out; }
.pf-relics:empty::after { content: "RELICS · 사기 도구 없음"; font: 1rem/1 var(--f-kr); color: var(--txt3); white-space: nowrap; }

/* TOKENS (left column, bottom) */
.pf-tokpod { flex: none; flex-wrap: wrap; justify-content: center; gap: .3125rem; padding: .375rem .25rem .4375rem; }
.pf-tokpod > .pf-tab { flex-basis: 100%; text-align: center; }
.pf-tokpod .pf-tokamt { font-size: 1.6875rem; gap: .3125rem; }
.pf-tokpod .pf-token { width: 1.25rem; height: 1.25rem; }

/* status (bottom-left plate): hint · BALL IN HAND · trick prompt · rule chips · REPLAY · CLEAR */
.pf-hint {
  display: block; flex: 1 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  font: 1rem/1.2 var(--f-kr); color: var(--txt2); padding: 0 .125rem;
}
.pf-hint:empty { display: none; }
.pf-plate.bl.busy .pf-hint, .pf-plate.bl.prompting .pf-chip.hand, .pf-plate.bl.prompting .pf-replaybtn { display: none; }
.pf-tprompt {
  display: flex; flex: 1 1 auto; align-items: center; gap: .375rem; min-width: 0; height: calc(var(--plh) - .375rem); padding: 0 .1875rem; border-radius: .3125rem;
  background: var(--scan), rgba(11,6,20,.9);
  box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .125rem var(--cyan);
  animation: pf-tprompt 1.2s ease-in-out infinite;
}
.pf-tprompt-g { flex: none; display: grid; place-items: center; width: calc(var(--plh) - .875rem); height: calc(var(--plh) - .875rem); border-radius: .25rem; color: var(--ink); background: var(--cyan); box-shadow: 0 0 0 .125rem var(--ink); }
.pf-tprompt-g .pf-g { width: 80%; height: 80%; }
.pf-tprompt-tx { flex: 1 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font: 1rem/1.2 var(--f-kr); color: #fff; text-shadow: 0 .125rem 0 var(--ink); }
.pf-tprompt-x {
  flex: none; display: grid; place-items: center; width: calc(var(--plh) - .625rem); height: calc(var(--plh) - .625rem); min-width: 1.5rem; padding: 0; border: 0; border-radius: .25rem; cursor: pointer; color: #fff; background: var(--pink);
  box-shadow: 0 0 0 .125rem var(--ink), inset 0 .1875rem 0 rgba(255,255,255,.25);
}
.pf-tprompt-x .pf-g { width: 1rem; height: 1rem; }
.pf-tprompt-x:active { translate: 0 .125rem; }
@keyframes pf-tprompt { 0%, 100% { box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .125rem var(--cyan), 0 0 .25rem rgba(54,241,224,.3); } 50% { box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .125rem var(--cyan), 0 0 .875rem rgba(54,241,224,.7); } }
.pf-chip {
  flex: none; display: inline-flex; align-items: center; gap: .3125rem; padding: 0 .375rem; border: 0; border-radius: .3125rem; white-space: nowrap;
  font: 1.125rem/1 var(--f-px); color: #fff; text-shadow: 0 .125rem 0 rgba(11,6,20,.6);
  background: var(--bg4); box-shadow: 0 0 0 .125rem var(--ink);
}
.pf-chip .pf-g { width: 1.125rem; height: 1.125rem; }
.pf-chip .ko, .pf-chip b { font: 1rem/1 var(--f-kr); font-weight: normal; }
.pf-chip.sealed { background: var(--red); }
.pf-chip.tilt { background: var(--orange); }
.pf-chip.hand { background: var(--cyan-d); }
.pf-tilt-arrow { display: inline-grid; transition: transform .45s var(--spring); }
.pf-bosschip { cursor: help; min-width: 0; flex: 0 1 auto; background: var(--red); }
.pf-bosschip .pf-boss-ko { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: #FFE3E6; }
.pf-bosschip .pf-boss-en { display: none; }
.pf-anomchip { background: linear-gradient(90deg, var(--cyan-d), #5A33C8); box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .125rem rgba(54,241,224,.55); }
.pf-anomchip .pf-boss-g { color: var(--cyan); }
.pf-anomchip .pf-boss-ko { color: #CFFBF6; }
.pf-plate .pf-btn { min-height: 0; height: calc(var(--plh) - .375rem); padding: 0 .625rem; gap: .375rem; box-shadow: 0 0 0 .125rem var(--ink), inset 0 .1875rem 0 rgba(255,255,255,.22), inset 0 -.1875rem 0 rgba(0,0,0,.18); }
.pf-plate .pf-btn:active { translate: 0 .125rem; }
.pf-plate .pf-btn .pf-btn-ic { width: 1.125rem; height: 1.125rem; }
.pf-clearbtn { flex: 1 1 auto; animation: pf-bob 1.6s ease-in-out infinite; }
.pf-clearbtn .ko { font: 1.125rem/1 var(--f-krb); }
.pf-replaybtn .en { display: none; }

/* POWER bar (left column): press anywhere on it, pull down, release = shot. The cue slides down its track and the
   segments fill green → red. Cancel any time: push back up past where you pressed, slide off sideways, tap with a
   second finger, or right click — the bar turns red (취소) and releasing shoots nothing. */
.pf-powerctl {
  position: relative; flex: 1 1 auto; min-height: 7rem; display: flex; flex-direction: column; align-items: center; gap: .3125rem;
  padding: .375rem .25rem .4375rem; border-radius: .5rem; cursor: ns-resize; touch-action: none; pointer-events: auto;
  background: var(--scan), rgba(18,10,36,.9);
  box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .125rem rgba(80,48,150,.85), 0 .1875rem 0 0 var(--ink);
  transition: box-shadow .12s, background-color .12s, opacity .2s, filter .2s;
}
.pf-pw-track { position: relative; flex: 1 1 auto; width: 2.625rem; min-height: 3rem; border-radius: .375rem; overflow: hidden; background: rgba(8,4,18,.85); box-shadow: inset 0 0 0 .125rem rgba(80,48,150,.6); }
.pf-power-segs { position: absolute; inset: .25rem; display: flex; flex-direction: column; gap: .125rem; }
.pf-power-segs i { flex: 1 1 0; min-height: 0; border-radius: .0625rem; background: rgba(255,255,255,.07); }
.pf-power-segs i.on { background: var(--sc); box-shadow: 0 0 .375rem var(--sc); }
/* the cue: its white ferrule rides at the pull depth, the shaft trails up out of the track */
.pf-pw-cue { position: absolute; left: .375rem; right: .375rem; top: calc(var(--p, 0) * (100% - .625rem)); height: .625rem; border-radius: .125rem; background: #FFF7EA; box-shadow: 0 0 0 .125rem var(--ink), 0 0 .625rem rgba(255,247,234,.7); }
.pf-pw-cue::before { content: ""; position: absolute; left: 50%; bottom: calc(100% + .125rem); width: .5rem; height: 40rem; translate: -50% 0; background: linear-gradient(90deg, #8A5A2E, #E9C48A 45%, #A8743F); box-shadow: 0 0 0 .125rem var(--ink); }
.pf-pw-foot { flex: none; display: grid; place-items: center; min-height: 2.25rem; }
.pf-pw-foot > * { grid-area: 1 / 1; }
.pf-power-val { font: 1.6875rem/1 var(--f-px); color: #fff; text-shadow: var(--out); font-variant-numeric: tabular-nums; opacity: 0; }
.pf-pw-hint { font: .875rem/1.15 var(--f-kr); color: var(--txt3); text-align: center; }
.pf-powerctl.on .pf-power-val { opacity: 1; }
.pf-powerctl.on .pf-pw-hint { opacity: 0; }
.pf-powerctl[data-heat="1"] .pf-power-val { color: var(--orange); }
.pf-powerctl[data-heat="2"] .pf-power-val { color: var(--red); }
.pf-powerctl.on { box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .1875rem var(--yellow), 0 .1875rem 0 0 var(--ink), 0 0 1rem rgba(255,212,59,.35); }
.pf-pw-cancel {
  position: absolute; left: .25rem; right: .25rem; top: .25rem; z-index: 2; display: none; flex-direction: column; align-items: center; gap: .125rem;
  padding: .3125rem 0 .375rem; border-radius: .375rem; color: #FFD9DE; background: rgba(163,23,44,.6); box-shadow: 0 0 0 .125rem var(--ink);
  font: .875rem/1 var(--f-krb);
}
.pf-pw-cancel .pf-g { width: 1rem; height: 1rem; }
.pf-powerctl.on .pf-pw-cancel { display: flex; }
.pf-powerctl.cancel { background: var(--scan), rgba(110,12,30,.95); box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .1875rem var(--red), 0 .1875rem 0 0 var(--ink), 0 0 1.25rem rgba(255,59,78,.6); }
.pf-powerctl.cancel .pf-pw-cancel { color: #fff; background: var(--red); animation: pf-pop .3s var(--spring); }
.pf-powerctl.cancel .pf-power-segs i.on { background: rgba(255,255,255,.18); box-shadow: none; }
.pf-powerctl.cancel .pf-power-val { color: var(--txt3); }
.pf-hud.aiming .pf-powerctl:not(.on) .pf-pw-cue { animation: pf-pwbob 1.8s ease-in-out infinite; }
@keyframes pf-pwbob { 0%, 70%, 100% { translate: 0 0; } 35% { translate: 0 .75rem; } }

/* SPIN face (right column): the cue ball seen from behind — tap / drag where the tip should hit */
.pf-spinctl {
  flex: none; display: flex; flex-direction: column; align-items: center; gap: .3125rem; padding: .375rem .25rem .5rem; border-radius: .5rem;
  cursor: crosshair; touch-action: none; pointer-events: auto;
  background: var(--scan), rgba(18,10,36,.9); box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .125rem rgba(80,48,150,.85), 0 .1875rem 0 0 var(--ink);
  transition: opacity .2s, filter .2s;
}
.pf-spin-ball { position: relative; width: 3.5rem; height: 3.5rem; border-radius: 50%; background: radial-gradient(circle at 34% 28%, #FFFFFF 0 9%, #F6F0E2 32%, #C9BFAE 100%); box-shadow: 0 0 0 .125rem var(--ink), inset 0 -.25rem 0 rgba(0,0,0,.12); }
.pf-spin-x::before, .pf-spin-x::after { content: ""; position: absolute; left: 50%; top: 50%; background: rgba(120,110,150,.45); translate: -50% -50%; }
.pf-spin-x::before { width: 78%; height: .125rem; }
.pf-spin-x::after { width: .125rem; height: 78%; }
.pf-spin-dot { position: absolute; left: calc(50% + var(--sx, 0) * 1.3125rem); top: calc(50% + var(--sy, 0) * 1.3125rem); width: .875rem; height: .875rem; translate: -50% -50%; border-radius: 50%; background: #FF4060; box-shadow: 0 0 0 .125rem var(--ink); transition: left .08s, top .08s; }
.pf-spinctl.set .pf-spin-ball { box-shadow: 0 0 0 .125rem var(--ink), 0 0 0 .3125rem rgba(54,241,224,.55), 0 0 .875rem rgba(54,241,224,.6); }
.pf-spinctl.set .pf-ctl-lbl { color: var(--cyan); }

/* not aiming (balls rolling, tally, a trick picking): the aiming controls dim */
.pf-hud:not(.aiming) .pf-powerctl, .pf-hud:not(.aiming) .pf-spinctl { opacity: .45; filter: saturate(.4); }

.pf-sys { flex: none; display: flex; justify-content: space-between; gap: .25rem; }
.pf-sys .pf-iconbtn { width: 2.25rem; height: 2.25rem; }

/* TRICK cards (cyan = TRICK): one-shot actives, stacked at the bottom of the right column. A bright cyan face with an
   ink glyph (press and hold for the name). ready = sways · armed = yellow, glowing, ARMED tab ·
   targeting = white-hot ring + ✕ · dead = grey · idle = dim. Empty slots are dashed outlines. */
.pf-tricks { position: relative; flex: none; display: flex; flex-direction: column; align-items: stretch; gap: .5rem; transition: opacity .15s, visibility 0s; }
.pf-trick {
  --tc: var(--cyan); --tf: var(--cyan-d);
  position: relative; flex: none; display: flex; align-items: center; justify-content: center; height: 2.875rem; padding: .1875rem;
  border: 0; border-radius: .375rem; cursor: pointer; color: #fff;
  background: var(--scan), linear-gradient(180deg, #183C56, #12193A);
  box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .125rem var(--tc), 0 .1875rem 0 0 var(--ink);
  transition: translate .14s var(--spring), filter .15s, box-shadow .2s;
  animation: pf-sway 5s ease-in-out infinite; animation-delay: var(--sd, 0s);
}
.pf-trick-face {
  position: relative; flex: none; display: grid; place-items: center; width: 2.375rem; height: 2.375rem; border-radius: .25rem; color: var(--ink);
  background: radial-gradient(ellipse at 50% 30%, color-mix(in srgb, var(--tc) 55%, #ffffff), var(--tc) 55%, color-mix(in srgb, var(--tc) 70%, var(--tf)));
  box-shadow: 0 0 0 .125rem var(--ink), inset 0 .1875rem 0 rgba(255,255,255,.35), inset 0 -.1875rem 0 rgba(11,6,20,.22);
  transition: background .2s;
}
.pf-trick-face .pf-g { width: 1.875rem; height: 1.875rem; }
.pf-trick-name { display: none; }
.pf-trick-tag {
  position: absolute; left: 50%; top: -.75rem; z-index: 2; display: none; translate: -50% 0; padding: .125rem .25rem .1875rem; border-radius: .25rem;
  font: 1.125rem/1 var(--f-px); color: var(--ink); background: var(--yellow); box-shadow: 0 0 0 .125rem var(--ink), 0 0 .625rem rgba(255,212,59,.6); white-space: nowrap;
}
.pf-trick-x { position: absolute; right: -.375rem; top: -.4375rem; z-index: 2; display: none; place-items: center; width: 1.25rem; height: 1.25rem; border-radius: .25rem; color: #fff; background: var(--red); box-shadow: 0 0 0 .125rem var(--ink); }
.pf-trick-x .pf-g { width: 1rem; height: 1rem; }
.pf-trick-ring { position: absolute; inset: -.25rem; border-radius: .5rem; pointer-events: none; box-shadow: 0 0 0 .1875rem var(--tc), 0 0 1rem var(--tc); }
.pf-trick[data-state="ready"]:hover, .pf-trick[data-state="ready"]:focus-visible { filter: brightness(1.12); }
.pf-trick[data-state="ready"]:active { translate: 0 .1875rem; box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .125rem var(--tc); }
.pf-trick[data-state="armed"] { --tc: var(--yellow); --tf: var(--orange-d); animation: pf-armed .9s ease-in-out infinite; }
.pf-trick[data-state="armed"] .pf-trick-tag { display: block; }
.pf-trick[data-state="targeting"] { --tc: #B9FFF8; animation: pf-aiming 1.1s ease-in-out infinite; }
.pf-trick[data-state="targeting"] .pf-trick-x { display: grid; }
.pf-trick[data-state="dead"] { --tc: #6B6390; --tf: #3A3458; cursor: help; animation: none; filter: grayscale(.85) brightness(.75); }
.pf-trick[data-state="idle"] { cursor: default; animation: none; filter: saturate(.55) brightness(.7); }
.pf-trick.empty { cursor: help; animation: none; background: transparent; box-shadow: none; border: .125rem dashed rgba(54,241,224,.38); }
.pf-trick.burn { position: absolute; z-index: 3; margin: 0; pointer-events: none; animation: none; transition: none; }
.pf-trick-fx { position: absolute; z-index: 4; pointer-events: none; }
@keyframes pf-armed { 0%, 100% { box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .125rem var(--tc), 0 .1875rem 0 0 var(--ink), 0 0 .375rem rgba(255,212,59,.35); } 50% { box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .125rem var(--tc), 0 .1875rem 0 0 var(--ink), 0 0 1.25rem rgba(255,212,59,.85); } }
@keyframes pf-aiming { 0%, 100% { box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .1875rem var(--tc), 0 .1875rem 0 0 var(--ink), 0 0 .375rem rgba(54,241,224,.4); } 50% { box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .1875rem var(--tc), 0 .1875rem 0 0 var(--ink), 0 0 1.125rem rgba(54,241,224,.9); } }

/* short plates (small phones): labels go, numbers stay */
.pf-hud.tight .pf-plate .pf-tab:not(.pf-staketab), .pf-hud.tight .pf-shots .pf-lbl, .pf-hud.tight .pf-targetcol .pf-lbl:not(.pf-met) { display: none; }
.pf-hud.narrow .pf-shots .pf-lbl, .pf-hud.narrow .pf-chip.hand span { display: none; }
.pf-hud.narrow .pf-bosschip .pf-boss-ko { max-width: 5.5rem; }
.pf-fps { position: absolute; left: 50%; top: .375rem; z-index: 90; font: 1.125rem/1 var(--f-px); color: var(--green); text-shadow: var(--out); }

/* ------------------------------------------------------------------------------------------- tally plaque: [PTS] × [MULT] */
.pf-plaque { position: absolute; left: 50%; top: 0; z-index: 20; transform: translate(-50%, -100%); pointer-events: none; }
.pf-pl-inner { position: relative; }
.pf-pl-frame {
  position: relative; display: flex; flex-direction: row; align-items: center; gap: .75rem; padding: .5rem .625rem .625rem;
  border-radius: .5rem; background: var(--scan), linear-gradient(180deg, #2A1652, #170C2E);
  box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .1875rem var(--bg5), 0 .375rem 0 0 var(--ink);
  transition: box-shadow .3s;
}
.pf-plaque[data-fire="1"] .pf-pl-frame, .pf-plaque[data-fire="2"] .pf-pl-frame { box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .1875rem var(--orange), 0 .375rem 0 0 var(--ink), 0 0 1.5rem rgba(255,138,31,.55); }
.pf-plaque[data-fire="3"] .pf-pl-frame, .pf-plaque[data-fire="4"] .pf-pl-frame { box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .1875rem var(--red), 0 .375rem 0 0 var(--ink), 0 0 2.2rem rgba(255,59,78,.75); }
.pf-pl-line {
  display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: .3125rem; width: 15rem; align-self: stretch;
  padding: .375rem .625rem .4375rem; border-radius: .3125rem; background: rgba(8,4,18,.75); white-space: nowrap; overflow: hidden;
  font: 1.125rem/1 var(--f-px); color: #fff; text-shadow: 0 .125rem 0 var(--ink);
}
.pf-pl-row1, .pf-pl-row2 { display: flex; align-items: center; gap: .4375rem; max-width: 100%; overflow: hidden; }
.pf-pl-row1 .pf-pl-en { overflow: hidden; text-overflow: ellipsis; }
.pf-pl-right { position: relative; isolation: isolate; }
.pf-pl-ic { display: inline-flex; align-items: center; }
.pf-pl-ic:empty { display: none; }
.pf-pl-ic .pf-g { width: 1.375rem; height: 1.375rem; color: var(--yellow); }
.pf-pl-det { color: var(--txt3); }
.pf-pl-ko { font: 1rem/1 var(--f-kr); color: var(--txt2); }
.pf-pl-det:empty, .pf-pl-amt:empty, .pf-pl-ko:empty { display: none; }
.pf-pl-amt { padding: .125rem .375rem .1875rem; border-radius: .25rem; color: #fff; text-shadow: 0 .125rem 0 rgba(11,6,20,.6); box-shadow: 0 0 0 .125rem var(--ink); }
.pf-pl-amt.pts { background: var(--blue); }
.pf-pl-amt.mult { background: var(--red); }
.pf-pl-amt.xmult { background: var(--mag); }
.pf-pl-amt.bank, .pf-pl-amt.cash, .pf-pl-amt.chalk { background: var(--gold); color: var(--ink); text-shadow: none; }
.pf-pl-amt.shot { background: var(--bg5); }
.pf-pl-stack { display: grid; }
.pf-pl-stack > * { grid-area: 1 / 1; }
.pf-pl-eq { display: flex; align-items: center; gap: .5rem; }
.pf-pl-box {
  position: relative; display: flex; align-items: center; min-width: 9.5rem; height: 3.875rem; padding: .25rem .75rem .5rem; border-radius: .375rem;
  box-shadow: 0 0 0 .125rem var(--ink), inset 0 .25rem 0 rgba(255,255,255,.25), inset 0 -.3125rem 0 rgba(0,0,0,.22), 0 .3125rem 0 0 var(--ink);
}
.pf-pl-box.pts { justify-content: flex-end; background: var(--blue); }
.pf-pl-box.mult { justify-content: flex-start; background: var(--red); transition: background-color .15s; }
.pf-pl-box.mult.x { background: var(--mag); }
.pf-pl-box b { display: inline-block; font: 3.375rem/1 var(--f-px); font-weight: normal; color: #fff; text-shadow: var(--out); font-variant-numeric: tabular-nums; }
.pf-pl-x { display: inline-block; font: 2.25rem/1 var(--f-px); color: #fff; text-shadow: var(--out); }
.pf-pl-xghost { position: absolute; left: 50%; top: -.75rem; pointer-events: none; white-space: nowrap; font: 2.25rem/1 var(--f-px); color: var(--mag); text-shadow: var(--out), 0 0 .75rem rgba(232,60,255,.8); }
.pf-pl-total { display: flex; justify-content: center; align-items: center; opacity: 0; }
.pf-pl-total b { display: inline-block; font: 4.5rem/1 var(--f-px); font-weight: normal; color: #fff; text-shadow: var(--out-drop); font-variant-numeric: tabular-nums; }
.pf-plaque[data-tier="1"] .pf-pl-total b { color: var(--yellow); }
.pf-plaque[data-tier="2"] .pf-pl-total b { color: var(--orange); }
.pf-plaque[data-tier="3"] .pf-pl-total b { color: var(--red); text-shadow: var(--out-drop), 0 0 1rem rgba(255,59,78,.8); }
.pf-plaque.cashed:not(.molten) .pf-pl-total b { color: var(--gold); text-shadow: var(--out-drop), 0 0 1rem rgba(255,197,49,.8); }
.pf-plaque.slammed .pf-pl-en { font-size: 1.6875rem; }
.pf-plaque.slammed[data-tier="1"] .pf-pl-en { color: var(--yellow); }
.pf-plaque.slammed[data-tier="2"] .pf-pl-en { color: var(--orange); }
.pf-plaque.slammed[data-tier="3"] .pf-pl-en { color: var(--red); }
.pf-plaque.slammed[data-tier="4"] .pf-pl-en { color: var(--mag); animation: pf-blink .5s steps(2, start) infinite; }
.pf-pl-frame.hit { animation: pf-flash .32s ease-out; }
.pf-pl-fx { position: absolute; inset: 0; pointer-events: none; }
.pf-ember { position: absolute; bottom: 40%; width: .375rem; height: .375rem; background: var(--ec); box-shadow: 0 0 .5rem var(--ec); }

/* flames: tongues along the plaque top, taller with data-fire */
/* flames burn behind the boxes and lick just past the frame top — they stay on the rail, off the felt and pocket */
.pf-pl-fire { position: absolute; left: -.5rem; right: -.5rem; bottom: -.375rem; height: 0; z-index: -1; pointer-events: none; transition: height .35s var(--spring); }
.pf-plaque[data-fire="1"] .pf-pl-fire { height: 4.25rem; }
.pf-plaque[data-fire="2"] .pf-pl-fire { height: 4.625rem; }
.pf-plaque[data-fire="3"] .pf-pl-fire { height: 5rem; }
.pf-plaque[data-fire="4"] .pf-pl-fire { height: 5.375rem; }
.pf-flame {
  position: absolute; bottom: 0; width: var(--w, 3rem); height: var(--h, 100%); margin-left: calc(var(--w, 3rem) / -2);
  border-radius: 50% 50% 35% 35% / 70% 70% 30% 30%;
  background: radial-gradient(ellipse 50% 70% at 50% 100%, #FFFBD0 0%, var(--yellow) 22%, var(--orange) 46%, var(--red) 68%, rgba(255,59,78,0) 71%);
  transform-origin: 50% 100%; mix-blend-mode: screen;
  animation: pf-flicker var(--fs, .5s) steps(3, jump-none) infinite alternate; animation-delay: var(--fdl, 0s);
}
.pf-plaque[data-fire="4"] .pf-flame { background: radial-gradient(ellipse 50% 70% at 50% 100%, #FFFFFF 0%, var(--yellow) 18%, var(--orange) 36%, var(--pink) 56%, var(--mag) 68%, rgba(232,60,255,0) 71%); }

/* ------------------------------------------------------------------------------------------- layers & cards */
.pf-layer { position: absolute; inset: 0; pointer-events: auto; }
.pf-dim { background: var(--scan), radial-gradient(ellipse at 50% 45%, rgba(18,8,36,.66) 0%, rgba(8,4,16,.88) 100%); }
.pf-dim2 { background: rgba(8,4,16,.62); }
.pf-center { display: flex; align-items: center; justify-content: center; padding: 1.25rem; overflow-y: auto; }
.pf-center > * { margin: auto; }
.pf-card { position: relative; max-width: calc(100vw - 2rem); }
.pf-panel {
  position: relative; border-radius: .5rem; color: var(--txt);
  background: var(--scan), linear-gradient(180deg, #2A1652 0%, #1C1036 40%, #140A2A 100%);
  box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .1875rem var(--bg5), inset 0 .375rem 0 .1875rem rgba(140,100,230,.2), 0 .5rem 0 0 var(--ink), 0 1.5rem 3rem rgba(0,0,0,.55);
}
.pf-card-cap { display: flex; justify-content: center; margin-bottom: .75rem; }
.pf-card-actions { position: relative; display: flex; justify-content: center; flex-wrap: wrap; gap: .875rem; margin-top: 1.25rem; }
.pf-card-note { margin: 0; font: 1rem/1.5 var(--f-kr); color: var(--txt2); }
.pf-card-note b { font: 1.6875rem/1 var(--f-px); font-weight: normal; color: var(--red); text-shadow: var(--out); }
.pf-rule2 { height: .25rem; margin: .875rem 0; border-radius: .125rem; background: repeating-linear-gradient(90deg, var(--pink) 0 .75rem, var(--cyan) .75rem 1.5rem); opacity: .5; }
.pf-headline {
  display: inline-block; padding: .05em .08em .1em; font: 4.6667rem/1 var(--f-ar); font-weight: normal; text-align: center; letter-spacing: .0625rem;
  color: transparent; -webkit-background-clip: text; background-clip: text;
  background-image: repeating-linear-gradient(0deg, rgba(11,6,20,.28) 0 2px, rgba(0,0,0,0) 2px 4px), linear-gradient(180deg, #FFF6B8 0%, var(--yellow) 32%, var(--orange) 58%, var(--pink) 84%, var(--mag) 100%);
  filter: drop-shadow(.1875rem 0 0 var(--ink)) drop-shadow(-.1875rem 0 0 var(--ink)) drop-shadow(0 .1875rem 0 var(--ink)) drop-shadow(0 -.1875rem 0 var(--ink)) drop-shadow(0 .375rem 0 var(--ink)) drop-shadow(0 0 1rem rgba(255,46,136,.5));
}
.pf-headline.gold { background-image: repeating-linear-gradient(0deg, rgba(11,6,20,.22) 0 2px, rgba(0,0,0,0) 2px 4px), linear-gradient(180deg, #FFFBD8 0%, #FFE27A 34%, var(--gold) 58%, #E88A00 100%); filter: drop-shadow(.1875rem 0 0 var(--ink)) drop-shadow(-.1875rem 0 0 var(--ink)) drop-shadow(0 .1875rem 0 var(--ink)) drop-shadow(0 -.1875rem 0 var(--ink)) drop-shadow(0 .375rem 0 var(--ink)) drop-shadow(0 0 1rem rgba(255,197,49,.6)); }
.pf-headline.red { background-image: repeating-linear-gradient(0deg, rgba(11,6,20,.25) 0 2px, rgba(0,0,0,0) 2px 4px), linear-gradient(180deg, #FFD0D4 0%, #FF6B78 34%, var(--red) 60%, #B0102A 100%); filter: drop-shadow(.1875rem 0 0 var(--ink)) drop-shadow(-.1875rem 0 0 var(--ink)) drop-shadow(0 .1875rem 0 var(--ink)) drop-shadow(0 -.1875rem 0 var(--ink)) drop-shadow(0 .375rem 0 var(--ink)) drop-shadow(0 0 1rem rgba(255,59,78,.55)); }
.pf-headline.cyan { background-image: repeating-linear-gradient(0deg, rgba(11,6,20,.25) 0 2px, rgba(0,0,0,0) 2px 4px), linear-gradient(180deg, #FFFFFF 0%, #B9FFF8 22%, var(--cyan) 46%, #2AA8FF 72%, var(--mag) 100%); filter: drop-shadow(.1875rem 0 0 var(--ink)) drop-shadow(-.1875rem 0 0 var(--ink)) drop-shadow(0 .1875rem 0 var(--ink)) drop-shadow(0 -.1875rem 0 var(--ink)) drop-shadow(0 .375rem 0 var(--ink)) drop-shadow(0 0 1rem rgba(54,241,224,.5)); }

/* table intro banner */
.pf-intro { cursor: pointer; }
.pf-intro-band {
  position: absolute; left: 0; right: 0; top: calc(var(--ty, 0px) + var(--th, 100vh) * .5); transform: translateY(-50%);
  padding: 1rem 1rem 1.375rem; text-align: center;
  background: var(--scan), linear-gradient(90deg, rgba(11,6,20,0) 0%, rgba(18,10,36,.92) 18%, rgba(18,10,36,.92) 82%, rgba(11,6,20,0) 100%);
}
.pf-intro-band::before, .pf-intro-band::after { content: ""; position: absolute; left: 10%; right: 10%; height: .25rem; }
.pf-intro-band::before { top: 0; background: var(--pink); box-shadow: 0 0 .75rem var(--pink); }
.pf-intro-band::after { bottom: 0; background: var(--cyan); box-shadow: 0 0 .75rem var(--cyan); }
.pf-intro-kind { display: inline-flex; align-items: center; gap: .5rem; margin-bottom: .375rem; padding: .25rem .625rem .3125rem; border-radius: .25rem; font: 1.125rem/1 var(--f-px); color: #fff; background: var(--orange); box-shadow: 0 0 0 .125rem var(--ink); text-shadow: 0 .125rem 0 rgba(11,6,20,.6); }
.pf-intro-kind .ko { font: 1rem/1 var(--f-kr); }
.pf-intro-kind .pf-g { width: 1.25rem; height: 1.25rem; }
.pf-intro[data-kind="boss"] .pf-intro-kind { background: var(--red); animation: pf-blink .6s steps(2, start) infinite; }
.pf-intro-title { display: flex; justify-content: center; align-items: baseline; gap: .75rem; }
.pf-intro-title .pf-headline { font-size: 7rem; }
.pf-intro-title .of { font: 2.25rem/1 var(--f-px); color: var(--txt3); text-shadow: var(--out); }
.pf-intro-target { display: flex; align-items: center; justify-content: center; gap: .75rem; margin-top: .25rem; }
.pf-intro-target .pf-lbl { color: var(--txt2); font-size: 1.6875rem; }
.pf-intro-target b { font: 3.375rem/1 var(--f-px); font-weight: normal; color: var(--red); text-shadow: var(--out-drop); }
/* ANOMALY table: teal → violet kind chip, the anomaly's name and its rule under the target */
.pf-intro[data-kind="anomaly"] .pf-intro-kind { background: linear-gradient(90deg, var(--cyan-d), #5A33C8); }
.pf-intro-anom { display: flex; flex-direction: column; align-items: center; gap: .4375rem; margin-top: .625rem; }
.pf-intro-anomname { display: flex; align-items: center; gap: .5rem; }
.pf-intro-anomname .pf-g { width: 1.5rem; height: 1.5rem; color: var(--cyan); filter: drop-shadow(0 .125rem 0 var(--ink)); }
.pf-intro-anomname .en { font: 1.6875rem/1 var(--f-px); color: var(--cyan); text-shadow: var(--out); }
.pf-intro-anomname .ko { font: 1.5rem/1 var(--f-krb); color: #fff; text-shadow: 0 .1875rem 0 var(--ink); }
.pf-intro-rule { display: flex; align-items: baseline; gap: .625rem; max-width: 36rem; margin: 0; padding: .4375rem .875rem .5rem; border-radius: .375rem; text-align: left; font: 1rem/1.45 var(--f-kr); color: var(--ink); background: #FFF7EA; box-shadow: 0 0 0 .125rem var(--ink), inset 0 -.25rem 0 rgba(11,6,20,.12); word-break: keep-all; }

}
