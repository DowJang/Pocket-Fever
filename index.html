.pf-trick-tok:hover, .pf-trick-tok:focus-visible { filter: brightness(1.15); }

.pf-felt-strip { position: relative; padding: .5rem .625rem .625rem; border-radius: .375rem; background: radial-gradient(120% 140% at 50% 0%, #1FA866, #0E7A4E 60%, #0A5C3B); box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .25rem #1A0C2E, inset 0 0 0 .375rem var(--pink), inset 0 .5rem .75rem rgba(0,0,0,.35); }
.pf-felt-strip.big { padding: .875rem 1rem 1rem; }
.pf-rack { display: flex; flex-wrap: wrap; gap: .375rem .5rem; padding: .25rem .375rem .375rem; }
.pf-rack-b { display: inline-flex; flex-direction: column; align-items: center; gap: .25rem; padding: .125rem; border: 0; border-radius: 50%; background: transparent; color: #fff; cursor: default; }
.pf-rack.pick { justify-content: center; gap: .5rem; }
.pf-rack.pick .pf-rack-b { min-width: 5rem; padding: .5rem .25rem .375rem; border-radius: .375rem; cursor: pointer; transition: translate .15s var(--spring), background-color .12s; }
.pf-rack.pick .pf-rack-b:hover, .pf-rack.pick .pf-rack-b:focus-visible { background: rgba(255,255,255,.12); translate: 0 -.25rem; }
.pf-felt-strip.big .pf-ball { width: 3rem; height: 3rem; }
.pf-felt-strip.big .pf-ball b { width: 1.375rem; height: 1.375rem; }
.pf-rack-l { font: 1rem/1.1 var(--f-kr); color: #fff; text-shadow: 0 .125rem 0 var(--ink); white-space: nowrap; }
.pf-rack-m { min-height: 1.125rem; font: 1.125rem/1 var(--f-px); color: var(--yellow); text-shadow: 0 .125rem 0 var(--ink); }
.pf-patlv { display: flex; flex-wrap: wrap; gap: .375rem; margin-top: .5rem; }
.pf-patchip { display: inline-flex; align-items: center; gap: .3125rem; padding: .1875rem .5rem .25rem; border-radius: .25rem; font: 1rem/1 var(--f-kr); color: #fff; background: var(--red); box-shadow: 0 0 0 .125rem var(--ink), 0 .1875rem 0 0 var(--ink); text-shadow: 0 .125rem 0 rgba(11,6,20,.6); }
.pf-patchip b { font: 1.125rem/1 var(--f-px); font-weight: normal; }
.pf-patchip .pf-g { width: 1.125rem; height: 1.125rem; }

.pf-pm { position: relative; width: 100%; }
.pf-pm-rail { position: absolute; inset: 0; border-radius: 9% / 15%; background: linear-gradient(180deg, #2A1446, #1A0C2E 60%, #12081F); box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .1875rem var(--orange), inset 0 0 0 .3125rem #1A0C2E, 0 .25rem 0 0 var(--ink); }
.pf-pm-cush { position: absolute; left: 5.29%; right: 5.29%; top: 9.23%; bottom: 9.23%; border-radius: 1.5%; background: #0A5C3B; box-shadow: 0 0 0 .125rem var(--pink), 0 0 .5rem rgba(255,46,136,.6); }
.pf-pm-felt { position: absolute; left: 2.29%; right: 2.29%; top: 4.38%; bottom: 4.38%; background: radial-gradient(120% 120% at 50% 40%, #1FA866, #0E7A4E 65%, #0B6642); }
.pf-pm-head { position: absolute; left: 25%; top: 0; bottom: 0; width: .125rem; background: rgba(255,255,255,.18); }
.pf-pm-spot { position: absolute; left: 75%; top: 50%; width: .25rem; height: .25rem; margin: -.125rem; background: rgba(255,255,255,.5); }
.pf-pm-pk { position: absolute; width: 8%; aspect-ratio: 1; transform: translate(-50%, -50%); padding: 0; border: 0; border-radius: 50%; background: transparent; display: grid; place-items: center; }
.pf-pm-hole { position: absolute; inset: 10%; border-radius: 50%; background: radial-gradient(circle at 50% 45%, #000 0 55%, #1A0C2E 100%); box-shadow: 0 0 0 .125rem #C9A0FF; transition: box-shadow .15s; }
.pf-pm-pk.mod .pf-pm-hole { box-shadow: 0 0 0 .1875rem var(--mc), 0 0 .625rem var(--mc); }
.pf-pm-g { position: absolute; left: 50%; top: 50%; width: 64%; height: 64%; transform: translate(-50%, -50%); color: var(--mc); display: grid; place-items: center; }
.pf-pm-g .pf-g { width: 100%; height: 100%; }
.pf-pm.big { width: 32rem; margin: 0 auto; }
.pf-pm.pick .pf-pm-pk { width: 11%; cursor: pointer; }
.pf-pm.pick .pf-pm-pk:hover .pf-pm-hole, .pf-pm.pick .pf-pm-pk:focus-visible .pf-pm-hole { box-shadow: 0 0 0 .25rem var(--yellow), 0 0 1.25rem var(--yellow); }
.pf-pm.pick .pf-pm-pk:focus-visible { outline: none; }

.pf-shop-next { display: flex; flex-direction: column; gap: .875rem; padding-top: .25rem; }
/* a next-table road: head band, TARGET + reward on one row, boss rule / note across, layout note + 선택 (up to three stack) */
.pf-next {
  --nc: var(--green);
  position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: .4375rem .5rem; padding: 0 0 .625rem;
  border: 0; border-radius: .5rem; cursor: pointer; text-align: left; overflow: hidden;
  color: var(--txt); background: var(--scan), linear-gradient(180deg, #2A1652, #1A0E34);
  box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .1875rem var(--nc), 0 .375rem 0 0 var(--ink);
  transition: translate .18s var(--spring), filter .15s;
  animation: pf-sway 6s ease-in-out infinite; animation-delay: var(--sd, 0s);
}
.pf-next.k-risky { --nc: var(--orange); }
.pf-next.k-boss { --nc: var(--red); }
.pf-next:hover, .pf-next:focus-visible { translate: 0 -.375rem; filter: brightness(1.12); }
.pf-next-head, .pf-next-boss, .pf-next-note { grid-column: 1 / -1; }
.pf-next-head { display: flex; justify-content: space-between; align-items: center; padding: .375rem .625rem .4375rem; background: var(--nc); box-shadow: inset 0 -.1875rem 0 var(--ink); }
.pf-next-kind { font: 1.6875rem/1 var(--f-px); color: #fff; text-shadow: var(--out); }
.pf-next-kind .ko { margin-left: .375rem; font: 1rem/1 var(--f-kr); }
.pf-next-no { font: 1.125rem/1 var(--f-px); color: rgba(11,6,20,.75); }
.pf-next-row { display: flex; align-items: center; gap: .5rem; padding: 0 .75rem; }
.pf-next-row + .pf-next-row { padding: 0 .75rem 0 0; }
.pf-next-row + .pf-next-row .pf-lbl { display: none; }
.pf-next-target { font: 2.25rem/1 var(--f-px); font-weight: normal; color: var(--red); text-shadow: var(--out); }
.pf-next-reward .pf-tokamt, .pf-next-row .pf-tokamt { font-size: 1.6875rem; }
.pf-next-boss { display: flex; flex-direction: column; gap: .25rem; margin: 0 .625rem; padding: .375rem .5rem .4375rem; border-radius: .3125rem; color: var(--ink); background: #FFF7EA; box-shadow: 0 0 0 .125rem var(--ink); }
.pf-next-bossname { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem .3125rem; }
.pf-next-bossname b { white-space: nowrap; }
.pf-next-bossname .pf-g { width: 1.25rem; height: 1.25rem; color: var(--red); }
.pf-next-bossname b { font: 1rem/1 var(--f-kr); font-weight: normal; }
.pf-next-bossname span { font: 1.125rem/1 var(--f-px); color: var(--red); }
.pf-next-rule { font: 1rem/1.35 var(--f-kr); word-break: keep-all; }
/* ANOMALY road: teal → violet head, its rule in a pale cyan box (720p: the name line only, rule in the tooltip) */
.pf-next.k-anomaly { --nc: #5A33C8; }
.pf-next.k-anomaly .pf-next-head { background: linear-gradient(90deg, var(--cyan-d), #5A33C8); }
.pf-next-anom { grid-column: 1 / -1; display: flex; flex-direction: column; gap: .25rem; min-width: 0; margin: 0 .625rem; padding: .375rem .5rem .4375rem; border-radius: .3125rem; color: var(--ink); background: #ECFDFB; box-shadow: 0 0 0 .125rem var(--ink); }
.pf-next-anomname { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem .3125rem; min-width: 0; }
.pf-next-anomname .pf-g { width: 1.25rem; height: 1.25rem; color: #5A33C8; }
.pf-next-anomname b { font: 1rem/1 var(--f-kr); font-weight: normal; white-space: nowrap; }
.pf-next-anomname .en { font: 1.125rem/1 var(--f-px); color: #5A33C8; white-space: nowrap; }
.pf-next-note, .pf-next-meta { padding: 0 .75rem; font: 1rem/1.3 var(--f-kr); color: var(--txt3); }
.pf-next-go { justify-self: end; margin-right: .625rem; display: inline-flex; align-items: center; gap: .375rem; padding: .3125rem .75rem .375rem; border-radius: .375rem; font: 1.125rem/1 var(--f-px); color: #fff; background: var(--orange); box-shadow: 0 0 0 .125rem var(--ink), 0 .1875rem 0 0 var(--orange-d), 0 .1875rem 0 .125rem var(--ink); text-shadow: 0 .125rem 0 rgba(11,6,20,.6); }
.pf-next-go .ko { font: 1rem/1 var(--f-kr); }
.pf-next-go .pf-g { width: 1.125rem; height: 1.125rem; }

/* pickers */
.pf-picker { width: 38rem; padding: 1.25rem 1.5rem 1.25rem; text-align: center; }
.pf-picker.wide { width: 40rem; }
.pf-picker-h { margin: .25rem 0 .375rem; font: 1.5rem/1.25 var(--f-krb); font-weight: normal; color: #fff; text-shadow: var(--out); }
.pf-picker-sub { margin: 0 auto 1rem; max-width: 32rem; font: 1rem/1.45 var(--f-kr); color: var(--txt2); word-break: keep-all; }
.pf-pick-relics { display: flex; flex-wrap: wrap; justify-content: center; gap: .625rem; }
.pf-pick-relic { position: relative; width: 7.5rem; padding: .75rem .375rem .625rem; border: 0; border-radius: .375rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: .375rem; color: #fff; background: rgba(11,6,20,.55); box-shadow: 0 0 0 .125rem rgba(80,48,150,.7); transition: translate .15s var(--spring); }
.pf-pick-relic:hover, .pf-pick-relic:focus-visible { background: rgba(255,59,78,.18); box-shadow: 0 0 0 .1875rem var(--red); translate: 0 -.25rem; }
.pf-pick-name { font: 1rem/1.15 var(--f-kr); }
.pf-pick-en { font: 1.125rem/1 var(--f-px); color: var(--txt3); }

/* ------------------------------------------------------------------------------------------- title: arcade marquee */
.pf-title { display: flex; flex-direction: column; justify-content: space-between; align-items: center; }
.pf-title-veil { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(8,4,16,.8) 0%, rgba(8,4,16,.35) 32%, rgba(8,4,16,0) 48%, rgba(8,4,16,0) 54%, rgba(8,4,16,.55) 72%, rgba(8,4,16,.9) 100%); }
.pf-title-top { position: relative; padding-top: 4vh; display: flex; flex-direction: column; align-items: center; }
.pf-marquee { position: relative; padding: 1.125rem 2.5rem 1.25rem; border-radius: .75rem; background: var(--scan), rgba(11,6,20,.62); box-shadow: 0 0 0 .1875rem var(--ink), inset 0 0 0 .1875rem var(--pink), 0 0 2rem rgba(255,46,136,.45); }
.pf-marquee.pf-bulbs::before { inset: -.8125rem; border-radius: 1rem; --chase: 1.1s; }
.pf-logo { margin: 0; display: flex; flex-direction: column; align-items: center; font-weight: normal; }
.pf-logo-word { position: relative; display: inline-block; font: 9.3333rem/.8 var(--f-ar); letter-spacing: .25rem; white-space: nowrap; }
.pf-logo-word::before { content: attr(data-text); position: absolute; left: 0; top: 0; color: #2A0A3A; -webkit-text-stroke: .875rem var(--ink); text-shadow: 0 .5rem 0 var(--ink), 0 .875rem 0 var(--ink); z-index: 0; }
.pf-logo-word > span { position: relative; z-index: 1; color: transparent; -webkit-background-clip: text; background-clip: text;
  background-image: repeating-linear-gradient(0deg, rgba(11,6,20,.32) 0 2px, rgba(0,0,0,0) 2px 5px),
    linear-gradient(180deg, #FFFBD2 0%, #FFE45C 20%, var(--yellow) 32%, var(--orange) 52%, #FF5A62 66%, var(--pink) 80%, var(--mag) 100%);
  filter: drop-shadow(0 0 .9rem rgba(255,46,136,.6)); }
.pf-logo-word.fever { margin-top: .5rem; }
.pf-logo-word.fever > span { background-image: repeating-linear-gradient(0deg, rgba(11,6,20,.32) 0 2px, rgba(0,0,0,0) 2px 5px),
    linear-gradient(180deg, #FFFFFF 0%, #C8FFF9 18%, var(--cyan) 38%, #2AA8FF 62%, var(--mag) 100%);
  filter: drop-shadow(0 0 .9rem rgba(54,241,224,.55)); }
.pf-tagline { margin-top: 1rem; font: 1.125rem/1 var(--f-px); color: var(--yellow); text-shadow: var(--out); letter-spacing: .125rem; text-align: center; }
.pf-tagline-ko { margin-top: .5rem; font: 1rem/1.3 var(--f-kr); color: var(--txt2); text-shadow: 0 .125rem 0 var(--ink); text-align: center; }
.pf-press { margin-top: 1.75rem; display: flex; align-items: baseline; gap: .75rem; font: 2.25rem/1 var(--f-px); color: #fff; text-shadow: var(--out-drop); animation: pf-blink 1.2s steps(2, start) infinite; }
.pf-press .ko { font: 1.5rem/1 var(--f-krb); }
.pf-title-bot { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1rem; padding-bottom: 2.5vh; }
.pf-select { display: flex; flex-direction: column; align-items: stretch; gap: .25rem; padding: .625rem .875rem .75rem; border-radius: .5rem; background: var(--scan), rgba(18,10,36,.88); box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .1875rem var(--bg5), 0 .375rem 0 0 var(--ink); }
.pf-sel-item { position: relative; display: grid; grid-template-columns: 1.75rem minmax(10rem, auto) minmax(6rem, auto); align-items: center; gap: .5rem; padding: .3125rem .75rem .375rem .375rem; border: 0; border-radius: .3125rem; cursor: pointer; background: transparent; color: var(--txt2); text-align: left; }
.pf-sel-cur { width: 1.5rem; height: 1.5rem; color: var(--yellow); opacity: 0; filter: drop-shadow(0 .125rem 0 var(--ink)); }
.pf-sel-item .ko { font: 1.5rem/1 var(--f-krb); text-shadow: 0 .1875rem 0 var(--ink); }
.pf-sel-item .en { font: 1.125rem/1 var(--f-px); color: var(--txt3); text-shadow: 0 .125rem 0 var(--ink); justify-self: end; }
.pf-sel-item.on { color: var(--yellow); background: rgba(255,212,59,.1); box-shadow: inset 0 0 0 .125rem rgba(255,212,59,.4); }
.pf-sel-item.on .pf-sel-cur { opacity: 1; animation: pf-nudge .5s steps(2, start) infinite; }
.pf-sel-item.on .en { color: var(--orange); }
.pf-sel-item:focus-visible { outline: none; }
.pf-chal-form { display: grid; grid-template-columns: 1.75rem minmax(0, 1fr) auto; align-items: center; gap: .5rem; padding: .25rem .375rem; }
.pf-input { width: 100%; min-width: 11rem; height: 2.5rem; padding: .3125rem .625rem 0; border: 0; border-radius: .3125rem; outline: none; font: 1.6875rem/1 var(--f-px); text-transform: uppercase; color: var(--yellow); background: var(--ink); box-shadow: inset 0 0 0 .125rem var(--bg5); -webkit-user-select: text; user-select: text; caret-color: var(--yellow); }
.pf-input:focus { box-shadow: inset 0 0 0 .1875rem var(--yellow); }
.pf-input::placeholder { font: 1rem/1 var(--f-kr); text-transform: none; color: var(--txt3); }
.pf-chal-go { min-height: 2.5rem; padding: 0 .75rem; }
.pf-title-foot { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.5rem; font: 1.125rem/1 var(--f-px); color: var(--txt3); text-shadow: 0 .125rem 0 var(--ink); }
.pf-title-foot > span { display: inline-flex; align-items: baseline; gap: .5rem; }
.pf-title-foot b { font-weight: normal; color: #fff; }
.pf-title-foot .hi b { color: var(--gold); }
.pf-title-foot .stk { cursor: help; }
.pf-title-foot .stk b { color: var(--sc); }

/* stake picker (NEW GAME once a stake is open): a staircase of rungs in a heat ramp, the chosen rung's rule and the
   lower rungs it carries. Locked rungs are grey with a lock (tooltip: 이전 판돈에서 이기면 열림). */
.pf-stakes { width: 36rem; padding: 1rem 1.5rem 1.25rem; text-align: center; }
.pf-stakes .pf-card-cap { margin-bottom: .25rem; }
.pf-stakes h2 { margin: 0; line-height: 0; }
.pf-stakes .pf-headline { font-size: 3.5rem; }
.pf-stk-sub { font: 1rem/1.35 var(--f-kr); color: var(--txt2); }
.pf-stk-row { display: flex; align-items: flex-end; justify-content: center; gap: .875rem; margin: 1.25rem 0 1rem; }
.pf-stk-step { margin-bottom: .875rem; }
.pf-stk-ladder { display: flex; align-items: flex-end; gap: .625rem; }
.pf-stk-rung {
  --sc: var(--green);
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .375rem;
  width: 3.5rem; height: var(--h, 3.5rem); padding: 0; border: 0; border-radius: .375rem; cursor: pointer; color: var(--sc);
  background: var(--scan), rgba(11,6,20,.75);
  box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .1875rem var(--sc), 0 .25rem 0 0 var(--ink);
  transition: translate .14s var(--spring), filter .15s;
}
.pf-stk-rung b { font: 2.25rem/1 var(--f-px); font-weight: normal; text-shadow: var(--out); }
.pf-stk-pips { display: flex; flex-wrap: wrap; justify-content: center; gap: .125rem; max-width: 2.25rem; }
.pf-stk-pips i { width: .3125rem; height: .3125rem; background: currentColor; box-shadow: 0 0 0 .0625rem var(--ink); }
.pf-stk-rung:not(.locked):hover { translate: 0 -.1875rem; filter: brightness(1.15); }
.pf-stk-rung[aria-checked="true"] { --bc: var(--sc); color: var(--ink); translate: 0 -.375rem; background: var(--scan), var(--sc); box-shadow: 0 0 0 .125rem var(--ink), inset 0 .25rem 0 rgba(255,255,255,.35), inset 0 -.25rem 0 rgba(11,6,20,.2), 0 .25rem 0 0 var(--ink), 0 0 1.25rem var(--sc); }
.pf-stk-rung[aria-checked="true"] b { text-shadow: 0 .125rem 0 rgba(255,255,255,.35); }
.pf-stk-rung.pf-bulbs::before { --bc: var(--sc); inset: -.5rem; }
.pf-stk-rung[aria-checked="true"] .pf-stk-pips i { box-shadow: none; }
.pf-stk-rung.locked { cursor: help; color: #6B6390; background: var(--scan), rgba(11,6,20,.55); box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .1875rem rgba(107,99,144,.5), 0 .25rem 0 0 var(--ink); }
.pf-stk-rung.locked b { color: #5A527E; text-shadow: none; }
.pf-stk-rung.locked .pf-g { width: 1.25rem; height: 1.25rem; }
.pf-stk-rung:focus-visible { outline-offset: .5rem; }
.pf-stk-detail { --sc: var(--green); min-height: 13.25rem; padding: .75rem .875rem .875rem; border-radius: .375rem; text-align: left; background: rgba(11,6,20,.5); box-shadow: 0 0 0 .125rem rgba(80,48,150,.5), inset .25rem 0 0 var(--sc); }
.pf-stk-head { display: flex; align-items: center; gap: .625rem; }
.pf-stk-no { padding: .1875rem .375rem .25rem; border-radius: .25rem; font: 1.125rem/1 var(--f-px); color: var(--ink); background: var(--sc); box-shadow: 0 0 0 .125rem var(--ink); white-space: nowrap; }
.pf-stk-en { font: 1.6875rem/1 var(--f-px); color: #fff; text-shadow: var(--out); white-space: nowrap; }
.pf-stk-ko { margin-top: .4375rem; font: 1.5rem/1.15 var(--f-krb); color: var(--txt); text-shadow: 0 .1875rem 0 var(--ink); }
.pf-stk-rule { margin: .5rem 0 0; padding: .5rem .75rem .5625rem; border-radius: .375rem; font: 1rem/1.45 var(--f-kr); color: var(--ink); background: #FFF7EA; box-shadow: 0 0 0 .125rem var(--ink), inset 0 -.25rem 0 rgba(11,6,20,.12); word-break: keep-all; }
.pf-stk-incl { margin-top: .625rem; }
.pf-stk-incl .pf-cap { color: var(--txt2); }
.pf-stk-list { list-style: none; margin: .375rem 0 0; padding: 0; display: flex; flex-direction: column; gap: .3125rem; }
.pf-stk-list li { display: flex; align-items: baseline; gap: .5rem; font: 1rem/1.3 var(--f-kr); color: var(--txt2); }
.pf-stk-list b { flex: none; min-width: 1.375rem; padding: .0625rem .25rem .125rem; border-radius: .1875rem; text-align: center; font: 1.125rem/1 var(--f-px); font-weight: normal; color: var(--ink); background: var(--sc); box-shadow: 0 0 0 .125rem var(--ink); }
.pf-stk-list .en { flex: none; min-width: 8.5rem; font: 1.125rem/1 var(--f-px); color: var(--txt3); }
.pf-stk-note { margin: .625rem 0 0; font: 1rem/1.4 var(--f-kr); color: var(--txt3); }

/* ------------------------------------------------------------------------------------------- settings / pause / result */
.pf-settings { width: 50rem; padding: 1.125rem 1.5rem 1.25rem; }
.pf-settings .pf-card-cap .pf-headline { font-size: 3.5rem; }
.pf-set-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
.pf-set-sec { padding: .75rem .75rem .25rem; border-radius: .375rem; background: rgba(11,6,20,.45); box-shadow: 0 0 0 .125rem rgba(80,48,150,.5); }
.pf-set-sec h3 { display: flex; align-items: baseline; gap: .5rem; margin: 0 0 .875rem; font-weight: normal; }
.pf-set-sec h3 .ko { font: 1.5rem/1 var(--f-krb); color: #fff; text-shadow: var(--out); }
.pf-set-sec h3 .en { font: 1.125rem/1 var(--f-px); color: var(--cyan); }
.pf-set-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: .4375rem .75rem; margin-bottom: .875rem; }
.pf-set-lbl { display: flex; flex-direction: column; gap: .25rem; min-width: 0; }
.pf-set-lbl .ko { font: 1rem/1.15 var(--f-kr); color: #fff; }
.pf-set-lbl .en { font: 1.125rem/1 var(--f-px); color: var(--txt3); }
.pf-set-lbl .note { margin-top: .125rem; font: 1rem/1.3 var(--f-kr); color: var(--txt3); word-break: keep-all; }
.pf-set-val { grid-column: 2; grid-row: 1; font: 1.6875rem/1 var(--f-px); font-weight: normal; color: var(--yellow); text-shadow: var(--out); }
.pf-range { grid-column: 1 / -1; grid-row: 2; -webkit-appearance: none; appearance: none; width: 100%; height: 1.5rem; margin: 0; background: transparent; cursor: pointer; --v: 50%; }
.pf-range::-webkit-slider-runnable-track { height: .625rem; border-radius: .1875rem; background: linear-gradient(90deg, var(--orange) 0 var(--v), rgba(255,255,255,.1) var(--v) 100%); box-shadow: 0 0 0 .125rem var(--ink); }
.pf-range::-webkit-slider-thumb { -webkit-appearance: none; width: 1.125rem; height: 1.5rem; margin-top: -.4375rem; border-radius: .1875rem; background: #fff; box-shadow: 0 0 0 .125rem var(--ink), inset 0 -.25rem 0 #C9BDEB; }
.pf-range::-moz-range-track { height: .625rem; border-radius: .1875rem; background: rgba(255,255,255,.1); }
.pf-range::-moz-range-progress { height: .625rem; border-radius: .1875rem; background: var(--orange); }
.pf-range::-moz-range-thumb { width: 1.125rem; height: 1.5rem; border: 0; border-radius: .1875rem; background: #fff; box-shadow: 0 0 0 .125rem var(--ink); }
.pf-seg { grid-column: 1 / -1; display: flex; gap: .375rem; }
.pf-seg button { flex: 1; padding: .375rem .25rem .4375rem; border: 0; border-radius: .3125rem; cursor: pointer; font: 1rem/1 var(--f-kr); color: var(--txt2); background: var(--bg3); box-shadow: 0 0 0 .125rem var(--ink), 0 .1875rem 0 0 var(--ink); }
.pf-seg button:hover { background: var(--bg4); }
.pf-seg button[aria-checked="true"] { color: #fff; background: var(--orange); box-shadow: 0 0 0 .125rem var(--ink), 0 .1875rem 0 0 var(--orange-d), 0 .1875rem 0 .125rem var(--ink); text-shadow: 0 .125rem 0 rgba(11,6,20,.6); }
.pf-seg button:active { translate: 0 .1875rem; }
.pf-switch { position: relative; width: 4rem; height: 2rem; flex: none; border: 0; border-radius: .375rem; cursor: pointer; background: var(--bg3); box-shadow: 0 0 0 .125rem var(--ink), inset 0 .1875rem 0 rgba(0,0,0,.35); }
.pf-switch-knob { position: absolute; top: .25rem; left: .25rem; width: 1.5rem; height: 1.5rem; border-radius: .25rem; background: #fff; box-shadow: 0 0 0 .125rem var(--ink), inset 0 -.25rem 0 #C9BDEB; transition: transform .16s var(--spring); }
.pf-switch[aria-checked="true"] { background: var(--green); }
.pf-switch[aria-checked="true"] .pf-switch-knob { transform: translateX(2rem); }
.pf-switch-on, .pf-switch-off { position: absolute; top: 50%; transform: translateY(-50%); font: 1.125rem/1 var(--f-px); }
.pf-switch-on { left: .4375rem; color: #fff; text-shadow: 0 .125rem 0 rgba(11,6,20,.5); }
.pf-switch-off { right: .3125rem; color: var(--txt3); }
.pf-switch[aria-checked="true"] .pf-switch-off, .pf-switch[aria-checked="false"] .pf-switch-on { opacity: 0; }

.pf-pause { width: 24rem; padding: 1.25rem 1.75rem 1.25rem; text-align: center; }
.pf-pause-h { display: flex; flex-direction: column; align-items: center; gap: .25rem; }
.pf-pause-h h2 { margin: 0; line-height: 0; }
.pf-pause-h .pf-headline { font-size: 4.6667rem; }
.pf-pause-h .ko { font: 1rem/1 var(--f-kr); color: var(--txt2); }
.pf-pause-menu { display: flex; flex-direction: column; gap: .875rem; margin-top: .25rem; }
.pf-pause-note { margin: 1rem 0 0; font: 1rem/1.4 var(--f-kr); color: var(--txt3); }

.pf-result { width: 42rem; padding: 1rem 1.75rem 1.25rem; text-align: center; }
.pf-res-head { display: flex; justify-content: space-between; align-items: center; }
.pf-res-meta { display: inline-flex; align-items: center; gap: .625rem; }
.pf-res-tables { font: 1.125rem/1 var(--f-px); color: var(--txt3); }
.pf-res-stake { padding: .1875rem .375rem .25rem; border-radius: .25rem; cursor: help; font: 1.125rem/1 var(--f-px); color: var(--ink); background: var(--sc); box-shadow: 0 0 0 .125rem var(--ink); white-space: nowrap; }
.pf-res-title { margin: .125rem 0 0; line-height: 0; }
.pf-res-title .pf-headline { font-size: 7rem; }
.pf-res-sub { margin-top: .375rem; font: 1rem/1.4 var(--f-kr); color: var(--txt2); }
.pf-res-total { position: relative; display: flex; flex-direction: column; align-items: center; gap: .375rem; }
.pf-res-score { font: 4.5rem/1 var(--f-px); font-weight: normal; color: var(--gold); text-shadow: var(--out-drop), 0 0 1rem rgba(255,197,49,.45); font-variant-numeric: tabular-nums; }
.pf-ribbon { display: inline-flex; align-items: center; gap: .5rem; padding: .3125rem .75rem .375rem; border-radius: .375rem; font: 1.6875rem/1 var(--f-px); color: #fff; background: var(--pink); box-shadow: 0 0 0 .125rem var(--ink), 0 0 1rem rgba(255,46,136,.6); text-shadow: var(--out); animation: pf-blink .9s steps(2, start) infinite; }
.pf-ribbon .ko { font: 1rem/1 var(--f-kr); }
.pf-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; margin-top: .875rem; }
.pf-stat { display: flex; flex-direction: column; align-items: center; gap: .375rem; padding: .625rem .375rem .5625rem; border-radius: .375rem; background: rgba(11,6,20,.55); box-shadow: 0 0 0 .125rem rgba(80,48,150,.55); }
.pf-stat-v { display: inline-flex; align-items: center; gap: .3125rem; font: 2.25rem/1 var(--f-px); color: #fff; text-shadow: var(--out); font-variant-numeric: tabular-nums; }
.pf-stat-v small { font: 1rem/1 var(--f-kr); color: var(--txt3); text-shadow: none; }
.pf-stat-cash { display: inline-flex; align-items: center; gap: .3125rem; color: var(--gold); }
.pf-stat-k .ko { font: 1rem/1 var(--f-kr); color: var(--txt2); }
.pf-stat-k .en { display: block; margin-top: .25rem; font: 1.125rem/1 var(--f-px); color: var(--txt3); }
.pf-stat.blue .pf-stat-v { color: var(--blue); }
.pf-stat.wish .pf-stat-v { color: var(--wish); }
.pf-stat.hot .pf-stat-v { color: var(--mag); }
.pf-stat.green .pf-stat-v { color: var(--green); }
.pf-res-chal { display: flex; align-items: center; justify-content: center; gap: 1rem; margin-top: .75rem; padding: .5rem; border-radius: .375rem; background: rgba(11,6,20,.55); }
.pf-res-vs { display: inline-flex; align-items: baseline; gap: .5rem; font: 1.125rem/1 var(--f-px); color: var(--txt3); }
.pf-res-vs b { font: 1.6875rem/1 var(--f-px); font-weight: normal; color: #fff; text-shadow: var(--out); }
.pf-res-verdict { font: 1.5rem/1 var(--f-krb); }
.pf-res-chal.won .pf-res-verdict { color: var(--green); }
.pf-res-chal.lost .pf-res-verdict { color: var(--red); }
.pf-res-unlocks { margin-top: .75rem; }
.pf-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem; margin-top: .5rem; }
.pf-unlock { padding: .3125rem .625rem .375rem; border-radius: .3125rem; font: 1rem/1 var(--f-kr); color: var(--ink); background: var(--cyan); box-shadow: 0 0 0 .125rem var(--ink), 0 .1875rem 0 0 var(--ink); }
.pf-res-code { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: .75rem; margin-top: .875rem; padding: .5rem .75rem; border-radius: .375rem; background: rgba(11,6,20,.55); }
.pf-code { padding: .3125rem .625rem .25rem; border-radius: .25rem; font: 1.6875rem/1 var(--f-px); color: var(--yellow); background: var(--ink); box-shadow: inset 0 0 0 .125rem var(--bg5); -webkit-user-select: all; user-select: all; pointer-events: auto; }

/* ------------------------------------------------------------------------------------------- BUILD view (build.ts) */
/* header (title · seed · table status · stake · ✕), the boss / anomaly rule, then three columns: relics + tricks ·
   rack + pockets + patterns · the score log (its own scroll). Every column scrolls inside if a screen runs short. */
.pf-bld-layer { padding: .75rem; }
.pf-build { display: flex; flex-direction: column; width: min(86rem, calc(100vw - 1.5rem)); max-height: calc(100vh - 1.5rem); padding: .75rem 1.25rem 1rem; }
.pf-bld-head { display: flex; align-items: center; gap: .875rem; padding-bottom: .5rem; border-bottom: .1875rem dashed rgba(122,90,214,.35); }
.pf-bld-title { display: flex; align-items: center; gap: .75rem; margin-right: auto; min-width: 0; }
.pf-bld-title h2 { margin: 0; line-height: 0; }
.pf-bld-title .pf-headline { font-size: 2.3333rem; }
.pf-bld-sub { display: flex; flex-direction: column; gap: .3125rem; }
.pf-bld-sub .ko { font: 1rem/1 var(--f-kr); color: var(--txt2); }
.pf-bld-seed { font: 1.125rem/1 var(--f-px); color: var(--txt3); white-space: nowrap; }
.pf-bld-seed code { font: inherit; color: var(--yellow); }
.pf-bld-status { display: flex; align-items: center; gap: .875rem; padding: .3125rem .75rem .375rem; border-radius: .375rem; background: rgba(11,6,20,.55); box-shadow: 0 0 0 .125rem rgba(80,48,150,.5); }
.pf-bld-stat { display: inline-flex; align-items: center; gap: .375rem; white-space: nowrap; }
.pf-bld-stat b { font: 1.6875rem/1 var(--f-px); font-weight: normal; color: #fff; text-shadow: var(--out); font-variant-numeric: tabular-nums; }
.pf-bld-stat .of { font: 1.125rem/1 var(--f-px); color: var(--txt3); }
.pf-bld-stat b.score.met { color: var(--gold); }
.pf-bld-stat b.shots { color: var(--green); }
.pf-bld-stat b.bank { color: var(--gold); }
.pf-bld-stake { padding: .1875rem .375rem .25rem; border-radius: .25rem; cursor: help; font: 1.125rem/1 var(--f-px); color: var(--ink); background: var(--sc); box-shadow: 0 0 0 .125rem var(--ink); white-space: nowrap; }
.pf-bld-keys { display: inline-flex; gap: .25rem; opacity: .75; }
.pf-bld-keys kbd { color: var(--txt2); }
.pf-bld-rule { display: flex; align-items: baseline; gap: .5rem; margin-top: .5rem; padding: .375rem .625rem .4375rem; border-radius: .375rem; font: 1rem/1.35 var(--f-kr); color: var(--ink); background: #FFF7EA; box-shadow: 0 0 0 .125rem var(--ink), inset 0 -.25rem 0 rgba(11,6,20,.1); word-break: keep-all; }
.pf-bld-rule .pf-g { width: 1.25rem; height: 1.25rem; align-self: center; }
.pf-bld-rule .en { font: 1.125rem/1 var(--f-px); white-space: nowrap; }
.pf-bld-rule .ko { white-space: nowrap; }
.pf-bld-rule.boss .pf-g, .pf-bld-rule.boss .en { color: #E0213A; }
.pf-bld-rule.anom .pf-g, .pf-bld-rule.anom .en { color: #5A33C8; }
.pf-bld-grid { flex: 1 1 auto; min-height: 0; display: flex; gap: 1.125rem; margin-top: .75rem; }
.pf-bld-col { flex: 0 0 26rem; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: .875rem; overflow-y: auto; padding: .125rem .25rem .25rem .125rem; scrollbar-width: thin; scrollbar-color: var(--bg5) transparent; }
.pf-bld-col.wide { flex: 1 1 0; overflow: hidden; }
.pf-bld-sec.log { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.pf-g.down svg { transform: rotate(90deg); }
/* kit rows (relics, tricks) */
.pf-bld-list { display: flex; flex-direction: column; gap: .375rem; }
.pf-bld-row { position: relative; display: flex; align-items: flex-start; gap: .5rem; padding: .375rem .5rem .4375rem .375rem; border-radius: .375rem; background: rgba(11,6,20,.5); box-shadow: 0 0 0 .125rem rgba(80,48,150,.5); }
.pf-bld-row.empty { align-items: center; background: transparent; box-shadow: 0 0 0 .125rem rgba(80,48,150,.28); }
.pf-bld-row.trick { cursor: help; }
.pf-bld-no { flex: none; width: 1rem; padding-top: .3125rem; text-align: center; font: 1.125rem/1 var(--f-px); color: var(--yellow); text-shadow: 0 .125rem 0 var(--ink); }
.pf-bld-row.empty .pf-bld-no { padding-top: 0; color: var(--txt3); }
.pf-ui kbd.pf-bld-key { flex: none; margin-top: .4375rem; min-width: 1.125rem; text-align: center; color: var(--ink); background: #FFF7EA; box-shadow: 0 0 0 .125rem var(--ink), inset 0 -.1875rem 0 #C9BDEB; }
.pf-bld-row.empty kbd.pf-bld-key { margin-top: 0; opacity: .45; }
.pf-bld-tile { --rc: #6D5BA8; flex: none; display: grid; place-items: center; width: 2.25rem; height: 2.25rem; border-radius: .3125rem; color: #fff; background: var(--scan), radial-gradient(circle at 50% 35%, #3E2580, #22113F); box-shadow: 0 0 0 .125rem var(--ink), inset 0 0 0 .1875rem var(--rc); }
.pf-bld-tile[data-r="2"] { --rc: var(--cyan-d); }
.pf-bld-tile[data-r="3"] { --rc: var(--pink); }
.pf-bld-tile .pf-g { width: 1.5rem; height: 1.5rem; filter: drop-shadow(0 .125rem 0 var(--ink)); }
.pf-bld-tile.trick { color: var(--ink); background: radial-gradient(ellipse at 50% 30%, #E6FFFC 0%, var(--cyan) 50%, var(--cyan-d) 100%); box-shadow: 0 0 0 .125rem var(--ink), inset 0 .1875rem 0 rgba(255,255,255,.35); }
.pf-bld-tile.trick .pf-g { filter: none; }
.pf-bld-tile.empty { width: 2rem; height: 2rem; background: transparent; box-shadow: none; border: .125rem dashed rgba(122,90,214,.45); }
.pf-bld-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .25rem; }
.pf-bld-name { display: flex; flex-wrap: wrap; align-items: center; gap: .1875rem .4375rem; }
.pf-bld-name .en { font: 1.125rem/1 var(--f-px); color: #fff; text-shadow: 0 .125rem 0 var(--ink); }
.pf-bld-name .ko { font: 1rem/1 var(--f-kr); color: var(--txt2); }
.pf-bld-name .pf-rarity { margin-left: auto; padding: .0625rem .25rem .125rem; }
.pf-bld-cnt { min-width: 1.25rem; padding: .0625rem .25rem 0; border-radius: .1875rem; text-align: center; font: 1.125rem/1 var(--f-px); color: var(--ink); background: var(--yellow); box-shadow: 0 0 0 .125rem var(--ink); }
.pf-bld-desc { font: 1rem/1.3 var(--f-kr); color: var(--txt2); word-break: keep-all; }
.pf-bld-none { margin: 0; font: 1rem/1.3 var(--f-kr); color: var(--txt3); }
.pf-bld-foot { margin: .5rem 0 0; font: 1rem/1.35 var(--f-kr); color: var(--txt3); word-break: keep-all; }
/* rack + wishes */
.pf-bld-rack { padding: .375rem .5rem .4375rem; }
.pf-bld-rack .pf-rack { gap: .3125rem .375rem; padding: .125rem .25rem .25rem; }
.pf-bld-wishes { display: flex; flex-direction: column; gap: .375rem; margin-top: .5rem; }
.pf-bld-wish { display: flex; align-items: flex-start; gap: .5rem; }
.pf-bld-wg { flex: none; display: grid; place-items: center; width: 1.375rem; height: 1.375rem; border-radius: .25rem; color: #fff; background: var(--wish); box-shadow: 0 0 0 .125rem var(--ink); }
.pf-bld-wg .pf-g { width: 1.125rem; height: 1.125rem; }
.pf-bld-wish .pf-bld-name .ko { color: #fff; }
.pf-bld-wish .pf-bld-name .en { color: var(--wish); }
.pf-bld-nums { font: 1.125rem/1 var(--f-px); color: var(--yellow); text-shadow: 0 .125rem 0 var(--ink); }
/* pockets: the shop's mini map + a legend of the modded ones */
.pf-bld-pockets { display: grid; grid-template-columns: 11rem minmax(0, 1fr); align-items: center; gap: .75rem; }
.pf-bld-legend { display: flex; flex-direction: column; gap: .375rem; min-width: 0; }
.pf-bld-pk { display: flex; align-items: center; gap: .375rem; min-width: 0; cursor: help; }
.pf-bld-pk .pf-g { flex: none; width: 1.125rem; height: 1.125rem; color: var(--mc); filter: drop-shadow(0 0 .25rem var(--mc)); }
.pf-bld-pk .ko { font: 1rem/1.1 var(--f-kr); color: #fff; }
.pf-bld-pk .at { display: none; }
/* patterns: two columns of cells — glyph, name, LV, then the reward (inline when it fits); locked ones dim, locked */
.pf-bld-pats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .3125rem; }
.pf-bld-pat { min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: .1875rem .5rem; padding: .25rem .375rem .3125rem; border-radius: .3125rem; cursor: help; background: rgba(11,6,20,.5); box-shadow: 0 0 0 .125rem rgba(80,48,150,.45); }
.pf-bld-pat-top { display: flex; align-items: center; gap: .3125rem; min-width: 0; }
.pf-bld-pat-top .pf-g { flex: none; width: 1.125rem; height: 1.125rem; color: var(--yellow); }
.pf-bld-pat-top .ko { font: 1rem/1.1 var(--f-kr); color: #fff; white-space: nowrap; }
.pf-bld-lv { padding: .0625rem .25rem .125rem; border-radius: .1875rem; font: 1.125rem/1 var(--f-px); font-weight: normal; color: #fff; background: var(--red); box-shadow: 0 0 0 .125rem var(--ink); text-shadow: 0 .125rem 0 rgba(11,6,20,.6); }
.pf-bld-pat-rw { font: 1rem/1.2 var(--f-kr); color: var(--txt2); word-break: keep-all; }
.pf-bld-pat.locked { background: transparent; box-shadow: 0 0 0 .125rem rgba(80,48,150,.22); }
.pf-bld-pat.locked .pf-bld-pat-top, .pf-bld-pat.locked .pf-bld-pat-rw { opacity: .45; }
.pf-bld-pat.locked .pf-g { color: var(--txt3); }
/* score log: shots newest first; each a head (SHOT n · total · PTS × MULT · CASH-OUT) and its ledger lines */
.pf-bld-logbody { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: .625rem; padding: .125rem .375rem .375rem .125rem; border-radius: .375rem; scrollbar-width: thin; scrollbar-color: var(--bg5) transparent; }
.pf-bld-logbody:focus-visible { outline: none; box-shadow: inset 0 0 0 .125rem rgba(54,241,224,.4); }
.pf-bld-empty { margin: auto; padding: 2rem 1rem; text-align: center; font: 1rem/1.4 var(--f-kr); color: var(--txt3); }
.pf-bld-shot { flex: none; overflow: hidden; border-radius: .375rem; background: rgba(11,6,20,.55); box-shadow: 0 0 0 .125rem rgba(80,48,150,.55); }
.pf-bld-shothead { display: flex; align-items: center; gap: .625rem; padding: .3125rem .5rem .375rem; background: rgba(80,48,150,.32); box-shadow: inset 0 -.125rem 0 rgba(11,6,20,.6); }
.pf-bld-shotno { padding: .125rem .375rem .1875rem; border-radius: .25rem; font: 1.125rem/1 var(--f-px); color: #fff; background: var(--bg5); box-shadow: 0 0 0 .125rem var(--ink); white-space: nowrap; }
.pf-bld-total { font: 1.6875rem/1 var(--f-px); font-weight: normal; color: #fff; text-shadow: var(--out); font-variant-numeric: tabular-nums; }
.pf-bld-shot[data-t="1"] .pf-bld-total { color: var(--yellow); }
.pf-bld-shot[data-t="2"] .pf-bld-total { color: var(--orange); }
.pf-bld-shot[data-t="3"] .pf-bld-total { color: var(--red); }
.pf-bld-shot[data-t="4"] .pf-bld-total { color: var(--mag); }
.pf-bld-eq { font: 1.125rem/1 var(--f-px); color: var(--txt3); white-space: nowrap; }
.pf-bld-eq .pts { color: var(--blue); }
.pf-bld-eq .mult { color: var(--red); }
.pf-bld-cash { margin-left: auto; display: inline-flex; align-items: center; gap: .3125rem; padding: .125rem .375rem .1875rem; border-radius: .25rem; font: 1.125rem/1 var(--f-px); color: var(--ink); background: var(--gold); box-shadow: 0 0 0 .125rem var(--ink); white-space: nowrap; }
.pf-bld-lines { display: flex; flex-direction: column; padding: .1875rem .375rem .25rem; }
.pf-bld-line { display: flex; align-items: center; gap: .4375rem; min-height: 1.75rem; padding: .125rem .125rem; border-bottom: .0625rem dashed rgba(122,90,214,.2); }
.pf-bld-line:last-child { border-bottom: 0; }
.pf-bld-shot.folded .pf-bld-line.fold { display: none; }
.pf-bld-lic { flex: none; display: grid; place-items: center; width: 1.375rem; height: 1.375rem; }
.pf-bld-lic .pf-g { width: 1.125rem; height: 1.125rem; color: var(--yellow); }
.pf-bld-lbl { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: .125rem .4375rem; }
.pf-bld-lbl .en { font: 1.125rem/1 var(--f-px); color: #fff; }
.pf-bld-lbl .ko { font: 1rem/1 var(--f-kr); color: var(--txt2); }
.pf-bld-lbl .det { font: 1.125rem/1 var(--f-px); color: var(--txt3); }
.pf-bld-line[data-k="note"] .pf-bld-lbl .en { color: var(--txt3); }
.pf-bld-amt { flex: none; padding: .125rem .375rem .1875rem; border-radius: .25rem; font: 1.125rem/1 var(--f-px); color: #fff; text-shadow: 0 .125rem 0 rgba(11,6,20,.6); box-shadow: 0 0 0 .125rem var(--ink); white-space: nowrap; }
.pf-bld-line[data-k="pts"] .pf-bld-amt { background: var(--blue); }
.pf-bld-line[data-k="mult"] .pf-bld-amt { background: var(--red); }
.pf-bld-line[data-k="xmult"] .pf-bld-amt { background: var(--mag); }
